<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billfold</title>
<meta name="theme-color" content="#F5F6F2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231F6F54'/></svg>">
<!-- Web-preview only: lets iOS/Android "Add to Home Screen" behave like an installed app.
     Has no effect on the real Capacitor-wrapped app, which uses its own native icon/splash. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Billfold">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
  :root{
    --paper:#F5F6F2; --card:#FFFFFF; --ink:#1B2A32; --sub:#63727A; --line:#E3E7E0;
    --pine:#1F6F54; --pine-soft:#E4F0E9; --amber:#A8611C; --amber-soft:#F8ECDC;
    --red:#A63D2F; --red-soft:#FBEDEA; --field:#FBFCFA; --track:#C6CEC6;
    --chip:#1B2A32; --chip-fg:#FFFFFF;
  }
  :root[data-theme="dark"]{
    --paper:#14181A; --card:#1E2426; --ink:#ECF0EE; --sub:#8B9A96; --line:#2C3538;
    --pine:#4CAF8C; --pine-soft:#1B3A2E; --amber:#E2A253; --amber-soft:#3A2A15;
    --red:#E2776A; --red-soft:#3A211D; --field:#191F21; --track:#3A4448;
    --chip:#1B3A2E; --chip-fg:#4CAF8C;
  }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size:16px; -webkit-font-smoothing:antialiased;
    transition:background-color .15s ease, color .15s ease;
  }
  button{ font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:0.9rem; color:var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--pine); outline-offset:2px;
  }
  .tnum{ font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* layout */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line);
    /* keep content clear of the camera cutout / status bar */
    padding-top:env(safe-area-inset-top, 0px);
  }
  .top-inner{ max-width:48rem; margin:0 auto; padding:0 1rem; height:3.5rem;
    display:flex; align-items:center; justify-content:space-between; }
  main{ max-width:48rem; margin:0 auto; padding:1rem 1rem 7.5rem; }
  .wordmark{ display:flex; align-items:center; gap:.5rem; user-select:none; }
  .wordmark .dot{ width:10px; height:10px; border-radius:3px; background:var(--pine); }
  .wordmark .name{ font-weight:800; font-size:1.15rem; letter-spacing:-0.02em; }

  nav.desktop{ display:none; gap:.25rem; }
  nav.desktop button{ padding:.35rem 1rem; border-radius:999px; font-size:.875rem; font-weight:500; color:var(--sub); }
  nav.desktop button.on{ background:var(--chip); color:var(--chip-fg); }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--card);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
    display:grid; grid-template-columns:repeat(5,1fr);
  }
  .tabbar button{ display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:.45rem 0 .5rem; font-size:.6rem; font-weight:500; color:var(--sub); white-space:nowrap; }
  .tabbar .tabicon{ display:flex; align-items:center; justify-content:center;
    width:52px; height:30px; border-radius:999px; transition:background .15s; }
  .tabbar button.on{ color:var(--pine); font-weight:700; }
  .tabbar button.on .tabicon{ background:var(--pine-soft); }
  .tabbar svg{ width:22px; height:22px; }

  /* floating add button — one primary action per screen, replacing top-of-list add buttons */
  .fab{ position:fixed; right:1.1rem; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:19;
    width:52px; height:52px; border-radius:50%; background:var(--pine); color:#fff;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .fab:active{ filter:brightness(0.95); }
  .fab-spacer{ height:76px; }
  @media (min-width:768px){
    .fab{ bottom:1.5rem; }
    .fab-spacer{ height:24px; }
  }

  /* calculator */
  .calc-top{ text-align:right; color:var(--sub); font-size:.95rem; min-height:1.2em;
    font-variant-numeric:tabular-nums; }
  .calc-display{ text-align:right; font-weight:800; font-size:2.1rem; letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums; overflow:hidden; white-space:nowrap; line-height:1.2; }
  .calc-hist{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .calc-chip{ border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:.3rem .65rem; font-size:.72rem; color:var(--sub); }
  .calc-chip b{ color:var(--ink); }
  .calc-chip.on{ background:var(--chip); color:var(--chip-fg); border-color:var(--chip); }
  .keys{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
  .calc-btn{ height:58px; border-radius:1rem; font-size:1.35rem; font-weight:600;
    background:var(--field); border:1px solid var(--line); color:var(--ink); }
  .calc-btn.op{ background:var(--pine-soft); border-color:var(--pine-soft); color:var(--pine); font-weight:700; }
  .calc-btn.fn{ background:var(--paper); color:var(--sub); font-size:1.15rem; }
  .calc-btn.eq{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .calc-btn:active{ filter:brightness(0.95); }
  .calcbtn{ flex:none; display:flex; align-items:center; justify-content:center;
    width:28px; height:28px; margin-left:1px; border-radius:8px; color:var(--sub); background:transparent; }
  .calcbtn:active{ background:var(--line); }

  @media (min-width:768px){
    nav.desktop{ display:flex; flex:1; justify-content:center; }
    nav.tabbar{ display:none; }
    main{ padding-bottom:3rem; }
  }

  /* components */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:1rem; margin-bottom:1rem;
    transition:background-color .15s ease, border-color .15s ease; }
  .pad{ padding:1rem; }
  .eyebrow{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--sub); margin-bottom:.75rem; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
  .row + .row{ margin-top:.65rem; }
  .row .lbl{ font-size:.9rem; }
  .muted{ color:var(--sub); }
  .divider{ border-top:1px solid var(--line); margin:.85rem 0; }
  .help-list{ padding-left:1.2rem; line-height:1.8; }
  .help-list li{ margin-bottom:.4rem; }
  .help-list li:last-child{ margin-bottom:0; }
  .help-p{ margin-top:.75rem; }

  .money{ display:flex; align-items:center; width:146px; border:1px solid var(--line);
    border-radius:.5rem; background:var(--field); padding:0 .25rem 0 .5rem; }
  .money span{ color:var(--sub); font-size:.85rem; }
  .money input{ flex:1; min-width:0; width:100%; border:none; background:transparent; text-align:right;
    padding:.4rem .15rem .4rem .25rem; font-weight:600; font-size:.875rem; }
  .money input:focus{ outline:none; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:.4rem;
    padding:.65rem 1rem; border-radius:.75rem; font-weight:600; font-size:.875rem; }
  .btn-ink{ background:var(--ink); color:#fff; }
  /* In dark mode --ink flips to a near-white text color, which would make .btn-ink buttons
     (Back up, Save, Save/Open backup file) render as a near-invisible white-on-white button.
     Give them the same solid pine treatment as the primary .btn-pine buttons (e.g. "+ Add bill")
     in dark mode specifically; light mode is unaffected. */
  :root[data-theme="dark"] .btn-ink{ background:var(--pine); }
  .btn-pine{ background:var(--pine); color:#fff; }
  .btn-ghost{ border:1px solid var(--line); }
  .btn-danger{ border:1px solid var(--line); color:var(--red); }
  .btn-danger.armed{ border-color:var(--red); background:var(--red-soft); }
  .btn[disabled]{ opacity:.4; cursor:default; }
  .btn-round{ padding:.5rem; border:1px solid var(--line); border-radius:999px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  /* Two .fgroup's placed side-by-side as grid2 columns are still adjacent DOM siblings, so
     without this override the vertical-stacking rule below pushes the second column down
     within its own cell, throwing the two columns out of alignment with each other. */
  .grid2 > .fgroup + .fgroup{ margin-top:0; }

  .field{ width:100%; border:1px solid var(--line); background:var(--field);
    border-radius:.75rem; padding:.6rem .75rem; font-weight:500; }
  label.flabel{ display:block; font-size:.875rem; font-weight:500; margin:0 0 .35rem; }
  .fgroup + .fgroup{ margin-top:.9rem; }

  /* month dial */
  .dial{ display:flex; align-items:center; justify-content:space-between; }
  .dial .title{ font-weight:800; font-size:1.5rem; letter-spacing:-0.02em; }
  .dial .subtitle{ font-size:.8rem; color:var(--sub); }
  .track{ height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:1rem; }
  .track .fill{ height:100%; border-radius:999px; background:var(--pine); transition:width .25s; }
  .track-caption{ display:flex; justify-content:space-between; font-size:.75rem; color:var(--sub); margin-top:.4rem; }

  .hero{ margin-top:.85rem; border-radius:.85rem; padding:.9rem 1rem; display:flex;
    align-items:baseline; justify-content:space-between; }
  .hero .amt{ font-weight:800; font-size:1.75rem; letter-spacing:-0.02em; }

  /* bill list */
  .bill-li{ display:flex; align-items:center; gap:.75rem; padding:.75rem 1rem; }
  .bill-li + .bill-li, li + li > .bill-li, ul.plain li + li{ border-top:1px solid var(--line); }
  ul.plain{ list-style:none; padding:0; }
  .checkbtn{ flex:none; width:26px; height:26px; border-radius:999px; border:2px solid var(--track);
    display:flex; align-items:center; justify-content:center; color:#fff; transition:background .15s,border-color .15s; }
  .checkbtn.paid{ background:var(--pine); border-color:var(--pine); }
  .checkbtn.skipped{ background:var(--line); border-color:var(--line); color:var(--sub); display:flex; align-items:center; justify-content:center; }
  .bill-main{ flex:1; display:flex; align-items:center; justify-content:space-between; text-align:left; padding:0; }
  .bill-name{ font-weight:600; font-size:.9rem; }
  .bill-name.done{ text-decoration:line-through; color:var(--sub); }
  .bill-cat{ font-size:.75rem; color:var(--sub); display:flex; align-items:center; gap:.35rem; }
  .cat-dot{ width:7px; height:7px; border-radius:999px; display:inline-block; flex:none; }
  .bill-amt{ text-align:right; }
  .bill-amt .due{ font-weight:700; font-size:.9rem; }
  .bill-amt .status{ font-size:.75rem; font-weight:600; }
  .list-head{ padding:1rem 1rem .5rem; display:flex; align-items:baseline; justify-content:space-between; }

  /* segmented control */
  .settings-icon{ flex:none; width:34px; height:34px; border-radius:999px; background:var(--pine-soft); color:var(--pine);
    display:flex; align-items:center; justify-content:center; }
  .settings-back{ flex:none; width:36px; height:36px; }
  .seg{ display:flex; flex-wrap:wrap; justify-content:center; border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:.25rem; width:fit-content; max-width:100%; margin:0 auto 1rem; }
  .seg button{ padding:.35rem 1rem; border-radius:999px; font-size:.875rem; font-weight:600; color:var(--sub); }
  .seg button.on{ background:var(--chip); color:var(--chip-fg); }

  /* donut */
  .donut-wrap{ position:relative; width:210px; height:210px; margin:0 auto .75rem; }
  .donut{ width:100%; height:100%; border-radius:50%; }
  .donut-hole{ position:absolute; inset:32px; border-radius:50%; background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-hole .amt{ font-weight:800; font-size:1.5rem; letter-spacing:-0.02em; }
  .donut-hole .cap{ font-size:.75rem; color:var(--sub); }
  .cat-bar{ height:4px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:.3rem; }
  .cat-bar .fill{ height:100%; border-radius:999px; }
  .report-li + .report-li{ margin-top:.7rem; }

  /* modal */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(20,30,35,.45);
    display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ width:100%; max-height:90vh; overflow-y:auto; background:var(--card);
    border-radius:1rem 1rem 0 0; padding:1.25rem;
    /* clear a 3-button Android nav bar the same way the header clears the notch */
    padding-bottom:calc(1.25rem + env(safe-area-inset-bottom, 0px)); }
  @media (min-width:640px){
    .overlay{ align-items:center; }
    .sheet{ max-width:28rem; border-radius:1rem; }
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
  .sheet-head h2{ font-size:1.1rem; font-weight:700; }

  .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
  .month-grid button{ padding:.65rem 0; border-radius:.75rem; border:1px solid var(--line);
    font-weight:600; font-size:.875rem; }
  .month-grid button.on{ background:var(--chip); color:var(--chip-fg); border-color:var(--chip); }

  .toggle{ width:40px; height:22px; border-radius:999px; background:var(--track); padding:2px;
    display:flex; align-items:center; justify-content:flex-start; transition:background .15s; flex:none; }
  .toggle.on{ background:var(--pine); justify-content:flex-end; }
  .toggle .knob{ width:18px; height:18px; border-radius:999px; background:#fff; }

  details{ border-top:1px solid var(--line); }
  details:first-of-type{ border-top:none; }
  details summary{ cursor:pointer; font-weight:600; font-size:.875rem; padding:.65rem 0;
    list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details summary::-webkit-details-marker{ display:none; }
  details summary::after{ content:"+"; color:var(--sub); font-weight:400; font-size:1.1rem; padding-left:.5rem; }
  details[open] summary::after{ content:"\2212"; }
  details .body{ font-size:.85rem; color:var(--sub); line-height:1.55; padding:0 0 .9rem; }
  details .body b{ color:var(--ink); }
  .banner{ max-width:48rem; margin:0 auto; padding:.6rem 1rem; font-size:.8rem; font-weight:500;
    color:var(--amber); background:var(--amber-soft); border-radius:0 0 .75rem .75rem; }
  .msg-ok{ color:var(--pine); font-size:.875rem; font-weight:500; margin:.5rem 0; }
  .msg-err{ color:var(--red); font-size:.875rem; font-weight:500; margin:.5rem 0; }
  textarea.code{ width:100%; min-height:130px; border:1px solid var(--line); background:var(--field);
    border-radius:.75rem; padding:.75rem; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.72rem; }
  .filelabel{ display:block; text-align:center; margin-bottom:.75rem; }
  .filelabel input{ display:none; }
  .hidden{ display:none; }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="wordmark"><span class="dot"></span><span class="name">Billfold</span></div>
    <nav class="desktop" id="desktopNav"></nav>
  </div>
  <div id="banner"></div>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar"></nav>
<div id="modalRoot"></div>
<div id="calcModalRoot"></div>
<div id="helpOverlayRoot"></div>
<div id="lockRoot"></div>

<script>
"use strict";
/* ================================================================
   BILLFOLD — standalone edition. One file, no internet required.
   Data auto-saves to this browser's local storage on this device.
   Cloud copy: Data tab -> Back up -> put the file in OneDrive.
   ================================================================ */

var KEY = "billfold:v1";
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var CHART_COLORS = ["#1F6F54","#3E7CB1","#C77B30","#7A5AA6","#B2456E","#5C8A3A","#8A6D3B","#4A6670","#9C4DCC","#2E8B8B"];
var PRIVACY_POLICY_URL = "https://jroot84.github.io/Billfold-PWA/privacy.html";
// Play Store listing URL — works whether or not the Play Store app is installed
// (opens the app on Android, falls back to the web listing in any browser).
var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.billfold.app";

/* ---------- icons (inline SVG) ---------- */
function icon(name, size){
  var s = size || 20;
  var paths = {
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    list: '<path d="M3 6h1M3 12h1M3 18h1M8 6h13M8 12h13M8 18h13"/>',
    pie: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
    db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 14.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    left: '<path d="M15 18l-6-6 6-6"/>',
    right: '<path d="M9 18l6-6-6-6"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>',
    down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
    up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
    calc: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
    journal: '<path d="M5 3h12l4 4v14H5z"/><path d="M17 3v4h4"/><path d="M9 10h7M9 14h7M9 18h4"/>',
    toolbox: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M2 13h20"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    theme: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor" stroke="none"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    more: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    sort: '<path d="M3 7h11M3 12h7M3 17h4"/><path d="M17 5v14M17 5l-3.5 3.5M17 5l3.5 3.5"/>',
    filter: '<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
    plus: '<path d="M12 5v14M5 12h14"/>'
  };
  return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+paths[name]+'</svg>';
}
// One floating add button per screen — the primary action, always reachable without scrolling
// to the top of a list. A spacer div (append separately, after the last piece of content) keeps
// it from ever sitting on top of the last row.
function fabHtml(onclick, ariaLabel){
  return '<button class="fab" aria-label="'+esc(ariaLabel)+'" onclick="'+onclick+'">'+icon("plus",24)+'</button>';
}

/* ---------- helpers ---------- */
function num(v){ var n = parseFloat(v); n = isFinite(n) ? n : 0; return Math.round(n*100)/100; }
function usd(n){
  var v = num(n);
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",
    minimumFractionDigits: Number.isInteger(v)?0:2, maximumFractionDigits:2}).format(v);
}
function mk(y,m){ return y+"-"+m; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dueInMonth(b,m){
  if(!b.active) return false;
  if(b.freq==="monthly") return true;
  if(b.freq==="semimonthly") return true;
  if(b.freq==="payday") return paydayDatesInMonth(view.y, m).length>0;
  if(b.freq==="even") return m%2===0;
  if(b.freq==="odd") return m%2===1;
  if(b.freq==="yearly") return (b.month||1)===m;
  return true;
}
/* An expense is either unpaid (showing its estimate) or paid (showing whatever amount was
   entered when it was marked paid) — there's no ongoing "amount owed" balance to track, since
   these are paid in one shot once the real bill is known, not chipped away at over the month. */
function baseAmount(e){ return num(e.estimate); }
function varPaidAmount(data, billId, occ){
  var d = data || md();
  var v = d.varPaid ? d.varPaid[leftKey(billId, occ||1)] : undefined;
  return (v===undefined||v===null) ? null : num(v); // null = unpaid
}
function fullAmountFor(e, data, occ){
  var paidAmt = varPaidAmount(data, e.id, occ);
  return paidAmt===null ? num(e.estimate) : paidAmt;
}
function monthlyEq(b){
  var a = baseAmount(b);
  if(b.freq==="semimonthly") return a*2;
  if(b.freq==="even"||b.freq==="odd") return a/2;
  if(b.freq==="yearly") return a/12;
  return a;
}
/* ---------- Income projection ----------
   Informational only — this never changes Available now or any bill math, it just powers the
   income-vs-spending comparisons already in Reports and Setup. Two modes: a flat monthly
   number you type directly (the original, simplest option — still the default for existing
   installs), or a projected total from your actual paycheck amount, frequency, and the last
   date you were paid. Weekly and biweekly get a real day-by-day projection, since those are
   the schedules where some months land an extra paycheck; semimonthly and monthly don't have
   that phenomenon, so they just use a flat per-month figure. */
var PAY_FREQUENCIES = [
  ["weekly","Every week"],
  ["biweekly","Every 2 weeks"],
  ["semimonthly","Twice a month"],
  ["monthly","Once a month"]
];
function payFrequencyLabel(key){
  var found = PAY_FREQUENCIES.filter(function(f){ return f[0]===key; })[0];
  return found ? found[1] : "Every 2 weeks";
}
function paychecksInMonth(y, m){
  var freq = S.payFrequency;
  if(freq==="semimonthly") return 2;
  if(freq==="monthly") return 1;
  if(freq!=="weekly" && freq!=="biweekly") return 0;
  var last = new Date(S.lastPaycheckDate+"T00:00:00");
  if(isNaN(last)) return 0;
  var interval = freq==="weekly" ? 7 : 14;
  var start = new Date(y, m-1, 1);
  var end = new Date(y, m, 0);
  var d = new Date(last);
  var diffDays = Math.round((start-d)/86400000);
  var steps = Math.floor(diffDays/interval);
  d.setDate(d.getDate()+steps*interval);
  while(d<start) d.setDate(d.getDate()+interval);
  var count = 0;
  while(d<=end){ count++; d.setDate(d.getDate()+interval); }
  return count;
}
function isoLocalDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// A "Every payday" bill has no anchor date of its own — it reuses the paycheck schedule
// directly, so it's always tied to however you actually get paid, with no reminders (a drifting
// cycle has no fixed "day of month" to remind against) and no separate setup. Only meaningful
// for Weekly/Every-2-weeks pay, since Monthly/Twice-a-month pay frequencies only ever track a
// paycheck *count*, not specific dates. Mirrors paychecksInMonth's exact math, returning the
// actual dates instead of just how many there are.
function paydayDatesInMonth(y, m){
  if(S.incomeMode!=="paycheck") return [];
  var freq = S.payFrequency;
  if(freq!=="weekly" && freq!=="biweekly") return [];
  var last = new Date(S.lastPaycheckDate+"T00:00:00");
  if(isNaN(last)) return [];
  var interval = freq==="weekly" ? 7 : 14;
  var start = new Date(y, m-1, 1);
  var end = new Date(y, m, 0);
  var d = new Date(last);
  var diffDays = Math.round((start-d)/86400000);
  var steps = Math.floor(diffDays/interval);
  d.setDate(d.getDate()+steps*interval);
  while(d<start) d.setDate(d.getDate()+interval);
  var dates = [];
  while(d<=end){ dates.push(new Date(d)); d.setDate(d.getDate()+interval); }
  return dates;
}
// The one place that knows "how many occurrences, and which ones" a bill has in a given month —
// everything else (rendering, totals, skip, projections) calls this instead of re-deriving the
// freq-specific logic itself. Occurrence identifiers are either the small int slots bills have
// always used (1, or 1&2 for semimonthly) or, for payday bills, the actual date string — since a
// drifting cycle has no stable "1st/2nd" slot that means the same thing month to month.
function billOccurrencesInMonth(b, y, m){
  if(b.freq==="payday") return paydayDatesInMonth(y, m).map(isoLocalDate);
  if(b.freq==="semimonthly") return [1, 2];
  return [1];
}
// The one place anything in the app should read "income" from — decides flat vs. paycheck
// projection so every caller (Reports, Setup) automatically benefits from either mode.
function monthlyIncomeFor(y, m){
  if(S.incomeMode==="paycheck" && num(S.paycheckAmount)>0 && S.lastPaycheckDate) return num(S.paycheckAmount) * paychecksInMonth(y, m);
  return num(S.income);
}
function freqText(b){
  if(b.freq==="yearly") return "Every "+MS[(b.month||1)-1];
  if(b.freq==="semimonthly") return "Twice a month"+((b.dueDay&&b.dueDay2)?" (days "+b.dueDay+" & "+b.dueDay2+")":"");
  if(b.freq==="payday") return "Every payday";
  return {monthly:"Monthly",even:"Even months",odd:"Odd months"}[b.freq]||"Monthly";
}
function catColor(cat){
  if(cat==="Credit/Debt") return "var(--pine)";
  if(typeof cat==="string" && cat.indexOf("→ ")===0) return "var(--pine)";
  var i = S.categories.indexOf(cat);
  return CHART_COLORS[(i<0?0:i)%CHART_COLORS.length];
}
function isSkipped(b, y, m, occ){
  var d = S.months[mk(y,m)];
  return !!(d && d.skipped && d.skipped[leftKey(b.id, occ||1)]);
}

/* ---------- storage: this device, this browser ---------- */
var storageOK = true;
function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); if(d && (d.expenses || d.bills)) return d; }
  }catch(e){ storageOK = false; }
  return null;
}
var saveTimer = null;
function persist(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    S.lastSaved = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
    catch(e){ storageOK = false; renderBanner(); }
  }, 400);
}

var S = loadState() || seedState();
// Every default-backfill and one-time migration a freshly loaded S needs — also called after
// restoring a backup (see imApply), since a restored S needs exactly the same treatment a
// normal page load gives it. Missing this after import was a real bug: older data could carry
// type:"fixed" bills, which billsList() no longer recognizes at all post-merge, and paid/unpaid
// state living in the old "left"/"actuals"/"paid" fields, which current code never reads —
// bills would vanish entirely or show the wrong paid status until these ran.
function ensureStateDefaultsAndMigrations(){
  if(!S.journal) S.journal = [];
  if(!S.savingsEntries) S.savingsEntries = [];
  if(S.remindersOn === undefined) S.remindersOn = false;
  if(!S.remindDays) S.remindDays = 3;
  if(S.devOptionsRevealed === undefined) S.devOptionsRevealed = false;
  /* Migrate existing installs: the investing calculator used to be a transient, unsaved
     global. Bring it into S so it persists going forward. */
  if(!S.calc) S.calc = { start:1000, contrib:100, freq:"monthly", rate:7, years:20 };
  if(S.backupRemindersOn === undefined) S.backupRemindersOn = true;
  if(!S.backupReminderDays) S.backupReminderDays = 14;
  if(!S.hiddenTabs) S.hiddenTabs = [];
  if(!S.debts) S.debts = [];
  if(!S.incomeMode) S.incomeMode = "flat";
  if(S.paycheckAmount===undefined) S.paycheckAmount = 0;
  if(!S.payFrequency) S.payFrequency = "biweekly";
  if(S.lastPaycheckDate===undefined) S.lastPaycheckDate = "";
  if(!S._migratedDebtBillsRemoved){
    var oldDebtBillIds = S.expenses.filter(function(e){ return !!e.linkedDebtId; }).map(function(e){ return e.id; });
    if(oldDebtBillIds.length){
      S.expenses = S.expenses.filter(function(e){ return !e.linkedDebtId; });
      Object.keys(S.months).forEach(function(k){
        oldDebtBillIds.forEach(function(id){
          if(S.months[k].left){ delete S.months[k].left[id]; delete S.months[k].left[id+":2"]; }
          if(S.months[k].paid){ delete S.months[k].paid[id]; delete S.months[k].paid[id+":2"]; }
          if(S.months[k].payMethod){ delete S.months[k].payMethod[id]; delete S.months[k].payMethod[id+":2"]; }
          if(S.months[k].debtPrincipalPaid){ delete S.months[k].debtPrincipalPaid[id]; delete S.months[k].debtPrincipalPaid[id+":2"]; }
        });
        if(S.months[k].debtInterestCharged) delete S.months[k].debtInterestCharged;
      });
    }
    // A debt/credit with an existing nonzero balance already has history worth showing as "Paid"
    // once it clears — mark that now so nothing that already had a balance goes invisible.
    S.debts.forEach(function(d){ if(num(d.balance)>0) d.everCarriedBalance = true; });
    S._migratedDebtBillsRemoved = true;
  }
  S.debts.forEach(function(d){ if(d.usableAsPayment===undefined) d.usableAsPayment = false; });
  /* Migrate existing installs to the simplified variable-bill tracking: derive "amount paid
     so far this month" from the old estimate/actual split, so history and reports read the
     same as before even though there's no separate "actual" field anymore. Runs once. */
  if(!S._migratedVariablePayTracking){
    (function(){
      var billsById = {};
      S.expenses.forEach(function(e){ billsById[e.id] = e; });
      Object.keys(S.months).forEach(function(mkKey){
        var month = S.months[mkKey];
        if(!month.actuals && !month.left) return;
        if(!month.left) month.left = {};
        if(!month.paid) month.paid = {};
        var keys = {};
        Object.keys(month.actuals||{}).forEach(function(k){ keys[k]=1; });
        Object.keys(month.left||{}).forEach(function(k){ keys[k]=1; });
        Object.keys(keys).forEach(function(key){
          var billId = (key.slice(-2)===":2") ? key.slice(0,-2) : key;
          var bill = billsById[billId];
          if(!bill || bill.type!=="variable") return;
          var oldActual = month.actuals ? month.actuals[key] : undefined;
          var totalOld = (oldActual===undefined||oldActual===null) ? num(bill.estimate) : num(oldActual);
          var leftOld = (month.left[key]===undefined||month.left[key]===null) ? totalOld : num(month.left[key]);
          var paidVal = totalOld - leftOld;
          month.left[key] = leftOld;
          if(paidVal) month.paid[key] = paidVal;
        });
      });
    })();
    S._migratedVariablePayTracking = true;
  }
  /* Migrate again to the simplified binary paid/unpaid model: variable bills no longer track
     an ongoing "amount owed," just whether they're paid and for how much. Anything with money
     already recorded against it closes out at that amount (the correct thing for Available now's
     history); anything with no payment yet reverts to showing the bill's estimate. Runs once. */
  if(!S._migratedVariableBinaryPaid){
    (function(){
      var billsById = {};
      S.expenses.forEach(function(e){ billsById[e.id] = e; });
      Object.keys(S.months).forEach(function(mkKey){
        var month = S.months[mkKey];
        if(!month.paid) return;
        if(!month.varPaid) month.varPaid = {};
        Object.keys(month.paid).forEach(function(key){
          var billId = (key.slice(-2)===":2") ? key.slice(0,-2) : key;
          var bill = billsById[billId];
          if(!bill || bill.type!=="variable") return;
          var paidAmt = num(month.paid[key]);
          if(paidAmt>0) month.varPaid[key] = paidAmt;
          delete month.paid[key];
          if(month.left) delete month.left[key];
        });
      });
    })();
    S._migratedVariableBinaryPaid = true;
  }
  /* Goal-linked bills always use the Variable payment mechanism now — a transfer amount is
     just as likely to come in under budget as any other variable expense, and the old Fixed+Goal
     combination never actually supported an editable/adjusted amount anyway. Convert any existing
     Fixed+Goal bills over: the flat "amount" becomes the new "estimate", and any month already
     marked paid gets its paid flag translated into the varPaid model so history reads the same. */
  if(!S._migratedGoalBillsToVariable){
    (function(){
      var goalFixedIds = {};
      S.expenses.forEach(function(e){
        if(e.linkedGoalId && e.type==="fixed"){
          goalFixedIds[e.id] = true;
          e.estimate = num(e.amount);
          e.type = "variable";
        }
      });
      if(Object.keys(goalFixedIds).length){
        Object.keys(S.months).forEach(function(mkKey){
          var month = S.months[mkKey];
          if(!month.left) return;
          if(!month.varPaid) month.varPaid = {};
          Object.keys(month.left).forEach(function(key){
            var billId = (key.slice(-2)===":2") ? key.slice(0,-2) : key;
            if(!goalFixedIds[billId]) return;
            if(num(month.left[key])===0){
              var bill = S.expenses.filter(function(x){ return x.id===billId; })[0];
              month.varPaid[key] = bill ? num(bill.estimate) : 0;
            }
            delete month.left[key];
          });
        });
      }
    })();
    S._migratedGoalBillsToVariable = true;
  }
  /* Fixed and Variable are now just "Bill" — one type, one mechanic. The distinction stopped
     earning its keep once Variable could do everything Fixed could (instant-check, editable
     amount, Skip) plus handle a bill coming in over or under expectations, which Fixed never
     could. Convert every remaining Fixed bill over: "amount" becomes "estimate", and any month
     already marked paid gets its paid flag translated into the varPaid model, same as above.
     Partial payment (Fixed's old "left" tracking) has no equivalent in the merged model — a bill
     is due or paid at whatever amount was confirmed, never "partway paid" in between. */
  if(!S._migratedAllBillsToVariable){
    (function(){
      var fixedIds = {};
      S.expenses.forEach(function(e){
        if(e.type==="fixed"){
          fixedIds[e.id] = true;
          e.estimate = num(e.amount);
          e.type = "variable";
        }
      });
      if(Object.keys(fixedIds).length){
        Object.keys(S.months).forEach(function(mkKey){
          var month = S.months[mkKey];
          if(!month.left) return;
          if(!month.varPaid) month.varPaid = {};
          Object.keys(month.left).forEach(function(key){
            var billId = (key.slice(-2)===":2") ? key.slice(0,-2) : key;
            if(!fixedIds[billId]) return;
            if(num(month.left[key])===0){
              var bill = S.expenses.filter(function(x){ return x.id===billId; })[0];
              month.varPaid[key] = bill ? num(bill.estimate) : 0;
            }
            delete month.left[key];
          });
        });
      }
    })();
    S._migratedAllBillsToVariable = true;
  }
  /* Category and "linked to a savings goal" used to be the same field — picking a goal replaced
     the category with a synthetic "→ Goal Name" string. They're independent now, so an existing
     goal-linked bill's category just loses that arrow prefix and becomes a normal, editable,
     reportable category — same name, same grouping, just no longer a special-cased string. */
  if(!S._migratedGoalCategorySplit){
    S.expenses.forEach(function(e){
      if(e.linkedGoalId && typeof e.category==="string" && e.category.indexOf("→ ")===0){
        e.category = e.category.slice(2);
        if(S.categories.indexOf(e.category)<0) S.categories.push(e.category);
      }
    });
    S._migratedGoalCategorySplit = true;
  }
  /* Debts and credit cards now show up as bills in their own Month-tab section, each with a
     payoff method: "full" (the default each month is whatever the live balance is — checking it
     off pays it off completely) or "fixed" (a set monthly amount, same as a regular bill). Loans
     never had a knowable "amount due" before; migrate them to fixed mode with a best-guess
     monthly payment since there's no way to infer their intended payment from old data. */
  if(!S._migratedDebtsPayoffMethod){
    (function(){
      var today = new Date();
      var curKey = mk(today.getFullYear(), today.getMonth()+1);
      S.debts.forEach(function(d){
        if(d.payoffMethod) return;
        d.payoffMethod = d.usableAsPayment ? "full" : "fixed";
        if(d.payoffMethod==="fixed"){
          d.monthlyPayment = num(d.paidOffAmount) || num(d.balance) || 0;
        }
        if(!d.paidMonths) d.paidMonths = {};
        if(!d.payMethodByMonth) d.payMethodByMonth = {};
        // Preserve "currently shows paid" continuity for anything already marked paid off.
        if(num(d.balance)<=0 && num(d.paidOffAmount)>0){
          d.paidMonths[curKey] = num(d.paidOffAmount);
          d.payMethodByMonth[curKey] = d.lastPayMethod || "available";
        }
      });
    })();
    S._migratedDebtsPayoffMethod = true;
  }
  /* Skip used to be a whole-month, whole-bill flag. It's now tracked per occurrence (the same
     way paid status already is), so a semimonthly or payday bill's payments can be skipped
     independently. Convert any existing skipMonths entries into the new shape — marking every
     occurrence that bill had that month as skipped, since that's what actually happened before
     (there was no way to skip just one occurrence yet). */
  if(!S._migratedSkipToPerOccurrence){
    S.expenses.forEach(function(b){
      if(!b.skipMonths || !b.skipMonths.length) return;
      b.skipMonths.forEach(function(monthKey){
        var parts = monthKey.split("-");
        var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
        if(isNaN(y) || isNaN(m)) return;
        if(!S.months[monthKey]) S.months[monthKey] = emptyMonth();
        var data = S.months[monthKey];
        if(!data.skipped) data.skipped = {};
        billOccurrencesInMonth(b, y, m).forEach(function(occ){
          data.skipped[leftKey(b.id, occ)] = true;

/* ---------- derived ---------- */
function emptyMonth(){ return {balance:0,oneTime:0,left:{},varPaid:{},payMethod:{},skipped:{}}; }
/* One-time expenses used to be two separate things: 3 named "card" slots, plus a single
   unnamed "One-time expenses" amount. They've been merged into just the 3 named slots
   (see S.cardNames). This folds any old per-month oneTime amount into the first slot once,
   then removes the field so it isn't double-counted or shown again. */
function migrateOneTimeExpenses(){
  if(S.migratedOneTime) return;
  var oldDefaults = ["Credit Card 1","Credit Card 2","Credit Card 3"];
  if(S.cardNames && S.cardNames.length===3 && oldDefaults.every(function(n,i){ return S.cardNames[i]===n; })){
    S.cardNames = ["Expense 1","Expense 2","Expense 3"];
  }
  Object.keys(S.months||{}).forEach(function(key){
    var mo = S.months[key];
    if(!mo) return;
    if(!mo.cards) mo.cards = [0,0,0];
    var ot = num(mo.oneTime);
    if(ot) mo.cards[0] = num(mo.cards[0]) + ot;
    delete mo.oneTime;
  });
  S.migratedOneTime = true;
  persist();
}
/* The 3 named slots turned out to be more than anyone needed once spending entries, funds, and
   debt/credit could all absorb the same use cases — down to a single one-time-expense amount,
   named once instead of per-slot. Sums whatever was in all 3 slots into that one number. */
function migrateToSingleOneTime(){
  if(S.migratedSingleOneTime) return;
  var defaultNames = ["Expense 1","Expense 2","Expense 3"];
  var customName = null;
  (S.cardNames||[]).forEach(function(n,i){ if(n && n!==defaultNames[i] && !customName) customName = n; });
  S.oneTimeName = customName || "One-time expense";
  Object.keys(S.months||{}).forEach(function(key){
    var mo = S.months[key];
    if(!mo) return;
    mo.oneTime = (mo.cards||[]).reduce(function(s,c){ return s+num(c); }, 0);
    delete mo.cards;
  });
  delete S.cardNames;
  S.migratedSingleOneTime = true;
  persist();
}
function md(){ return S.months[mk(view.y,view.m)] || emptyMonth(); }
/* One data model used to be two arrays (bills, funds); now it's one — S.expenses, each entry
   tagged with type "fixed" | "variable" | "fund". Old bills become "fixed" (their amount was
   always fixed in advance); old funds become "fund" as-is. Runs once per not-yet-converted
   save — the mere presence of S.expenses (even empty) means there's nothing to do, so this is
   safe to call every load and also correctly reprocesses an old backup restored later. */
function migrateExpenses(){
  if(S.expenses) return;
  var list = [];
  (S.bills||[]).forEach(function(b){
    list.push({ id:b.id, type:"fixed", name:b.name, amount:num(b.amount), freq:b.freq,
      month:b.month, dueDay:b.dueDay, dueDay2:b.dueDay2, category:b.category,
      active: !!b.active, remindOff:b.remindOff, linkedGoalId:b.linkedGoalId, skipMonths:b.skipMonths });
  });
  (S.funds||[]).forEach(function(f){
    list.push({ id:f.id, type:"fund", name:f.name, category:f.category, budget:num(f.budget), active: !!f.active });
  });
  S.expenses = list;
  delete S.bills;
  delete S.funds;
  persist();
}
/* Spending entries used to carry billLink/fundLink/applyTo. Bills can no longer be spending
   targets at all, so a fund-linked entry keeps its fund; anything else (an old bill-linked
   entry, or a plain pre-existing category) becomes an Unplanned entry with no fund attached —
   its category is preserved so historical reports don't change, even though new Unplanned
   entries are now required to pick a fund. Gated on an explicit flag since a legitimately
   fund-less legacy entry's fundId is intentionally undefined, so presence-of-field can't be
   used as the "already migrated" signal here the way it is for S.expenses. */
function migrateJournalEntries(){
  if(S.migratedJournalEntries) return;
  S.journal = (S.journal||[]).map(function(e){
    if(e.fundLink && e.fundLink.fundId){
      return { id:e.id, name:e.name, amount:num(e.amount), date:e.date, fundId:e.fundLink.fundId, unplanned:false, category:e.category, balanceAdjust:e.balanceAdjust||null };
    }
    return { id:e.id, name:e.name, amount:num(e.amount), date:e.date, fundId:null, unplanned:true, category:e.category||"Unplanned", balanceAdjust:e.balanceAdjust||null };
  });
  S.migratedJournalEntries = true;
  persist();
}
function billsList(){ return S.expenses.filter(function(e){ return e.type==="variable"; }); }
function fundsList(){ return S.expenses.filter(function(e){ return e.type==="fund"; }); }

/* ---------- Debts / Credit ----------
   A debt/credit balance is always live — no monthly reset, no interest calc, no separate
   "payment amount" to configure. You tell Billfold the real balance whenever it changes;
   paying it down (in full or in part) drains Available now or a linked card, same
   payment-method routing bills use. Interest-rate projections turned out to be more
   misleading than useful in practice, so there's no APR and no payoff-date estimate here —
   just a running total, corrected by hand against your statement as needed.

   Visibility on the Month tab (see debtCreditCard): revolving credit (usableAsPayment) stays
   visible once it's ever carried a balance, even at $0 — paying it off shows as "Paid" rather
   than the card vanishing, since you'll likely use it again. A brand new card with no history
   yet stays off the list until it's actually charged. Regular debt (a loan) only shows while
   balance > 0 — paying it off is a one-time event (see maybeShowDebtPayoffCongrats), so it
   drops off the list entirely once cleared rather than lingering in a "paid" state. */
function activeDebts(){ return S.debts.filter(function(d){ return d.active!==false; }); }
/* ---------- Payment Options ----------
   A "payment option" is anywhere money can come from when paying a bill, logging spending, or
   paying down another debt: Available Balance (the default), plus any active debt explicitly
   flagged as usable — a card or line of credit you'd actually charge things to. A car loan or
   personal loan wouldn't normally opt in here, since "charging" a purchase to it doesn't make
   sense. `excludeId` leaves a debt out of its own list, so a card can't be used to pay itself. */
function creditPaymentOptions(excludeId){ return activeDebts().filter(function(d){ return !!d.usableAsPayment && d.id!==excludeId; }); }
function paymentOptions(excludeId){
  return [{ id:"none", name:"Don't adjust a balance" }, { id:"available", name:"Available Balance" }]
    .concat(creditPaymentOptions(excludeId).map(function(d){ return { id:d.id, name:d.name }; }));
}
// Adding a charge to a credit-flagged debt (a bill, spending entry, or another debt's payment
// routed to it) — just adds to the balance, no interest math. Reversible via unchargeDebt.
function chargeDebt(debtId, amount, y, m){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt || amount<=0) return;
  debt.balance = num(num(debt.balance) + amount);
  if(debt.balance>0) debt.everCarriedBalance = true;
  // A new charge on a "pay in full" card that's already marked paid for that month means
  // there's newly unpaid money again — clear that month's paid flag (not the payment itself,
  // which already genuinely happened) so the row goes back to showing what's actually owed.
  if(debt.payoffMethod==="full" && y!=null && m!=null){
    var key = mk(y,m);
    if(debt.paidMonths && debt.paidMonths[key]!==undefined) delete debt.paidMonths[key];
  }
}
function unchargeDebt(debtId, amount){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt || amount<=0) return;
  debt.balance = Math.max(0, num(num(debt.balance) - amount));
}
// A payment "method" is "available" (Available Balance) or a debtId from paymentOptions().
// These two functions are the one place a bill, spending entry, or debt payment actually moves
// money — applying charges Available now or a credit balance; reversing undoes exactly that.
function applyPaymentEffect(y, m, method, amount){
  if(!amount) return;
  if(method==="none") return;
  if(method && method!=="available") chargeDebt(method, amount, y, m);
  else subtractBalanceAt(y, m, amount);
}
function reversePaymentEffect(y, m, method, amount){
  if(!amount) return;
  if(method==="none") return;
  if(method && method!=="available") unchargeDebt(method, amount);
  else{
    var k = mk(y,m);
    if(!S.months[k]) S.months[k] = emptyMonth();
    S.months[k].balance = num(num(S.months[k].balance) + amount);
  }
}
// An extra payment logged from Log → Spending against a debt: 100% principal (there's no
// interest to split out anymore), reducing the balance directly.
function applyDebtExtraPayment(debtId, amount){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt || amount<=0) return;
  debt.balance = Math.max(0, num(num(debt.balance) - amount));
  if(debt.balance<=0){ debt.paidOffAmount = num(amount); debt.lastPayMethod = "available"; }
}
function revertDebtExtraPayment(debtId, amount){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt || amount<=0) return;
  debt.balance = num(num(debt.balance) + amount);
}
// Amount due this month: the live balance for a "pay in full" debt (so checking it off always
// zeroes it out), or the fixed monthly payment for a "set amount" debt/loan — new charges don't
// touch this number, only the balance they're calculated against.
function debtDueAmount(debt){
  return debt.payoffMethod==="fixed" ? num(debt.monthlyPayment) : num(debt.balance);
}
function debtPaidAmount(debt, y, m){
  var v = debt.paidMonths ? debt.paidMonths[mk(y,m)] : undefined;
  return (v===undefined||v===null) ? null : num(v); // null = not paid this month
}
function debtLeftOf(debt, y, m){
  return debtPaidAmount(debt, y, m)===null ? debtDueAmount(debt) : 0;
}
function debtFullAmountFor(debt, y, m){
  var paidAmt = debtPaidAmount(debt, y, m);
  return paidAmt===null ? debtDueAmount(debt) : paidAmt;
}
// Marks (or corrects) this month's payment toward a debt — reduces the real balance and applies
// the payment effect, reversing whatever was previously paid this month first if this is a
// correction rather than a first payment. Mirrors markVariablePaidAt's reverse-then-reapply
// pattern, but also has to move the debt's own running balance, which a bill never has.
function markDebtPaidAt(y, m, debtId, amount, method){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt) return;
  if(!debt.paidMonths) debt.paidMonths = {};
  if(!debt.payMethodByMonth) debt.payMethodByMonth = {};
  var key = mk(y,m);
  var wasPaid = debt.paidMonths[key];
  var oldMethod = debt.payMethodByMonth[key] || debt.defaultPayMethod || "available";
  var newMethod = method || oldMethod;
  if(wasPaid!==undefined){
    reversePaymentEffect(y, m, oldMethod, num(wasPaid));
    debt.balance = num(debt.balance) + num(wasPaid);
  }
  var pay = Math.max(0, Math.min(num(amount), num(debt.balance)));
  if(pay>0) applyPaymentEffect(y, m, newMethod, pay);
  debt.balance = num(num(debt.balance) - pay);
  debt.paidMonths[key] = pay;
  debt.payMethodByMonth[key] = newMethod;
  if(debt.balance>0) debt.everCarriedBalance = true;
  return newMethod;
}
function markDebtPaid(debtId, amount, method){
  var m2 = markDebtPaidAt(view.y, view.m, debtId, amount, method);
  persist(); render();
  if(S.remindersOn) scheduleRemindersDebounced();
  return m2;
}
function unmarkDebtPaidAt(y, m, debtId){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt || !debt.paidMonths) return;
  var key = mk(y,m);
  var paidAmt = debt.paidMonths[key];
  if(paidAmt===undefined) return;
  var method = (debt.payMethodByMonth && debt.payMethodByMonth[key]) || "available";
  reversePaymentEffect(y, m, method, num(paidAmt));
  debt.balance = num(debt.balance) + num(paidAmt);
  delete debt.paidMonths[key];
  if(debt.payMethodByMonth) delete debt.payMethodByMonth[key];
}
function unmarkDebtPaid(debtId){
  unmarkDebtPaidAt(view.y, view.m, debtId);
  persist(); render();
  if(S.remindersOn) scheduleRemindersDebounced();
}
// Checkbox: pays the default due amount instantly, same principle as a Variable bill. Unchecking

function toggleDebtPaid(debtId){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt) return;
  if(debtPaidAmount(debt, view.y, view.m)===null){
    markDebtPaid(debtId, debtDueAmount(debt), undefined);
    if(!debt.usableAsPayment && num(debt.balance)<=0){ maybeShowDebtPayoffCongrats(debtId); return; }
    showBalanceWarning();
    return;
  }
  openDebtPay(debtId);
}
function maybeShowDebtPayoffCongrats(debtId){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];

  var warn = balanceWarning; balanceWarning = null;

    (warn ? '<p style="font-size:.85rem;font-weight:600;margin-bottom:.75rem;color:var(--amber)">'+esc(warn)+'</p>' : '')
    + '<p class="muted" style="font-size:.9rem;margin-bottom:1rem">That\'s '+usd(paidAmt)+' toward being debt-free. This one\'s done, so it\'s dropping off your Month tab.</p>'
    + '<button class="btn btn-pine" style="width:100%;margin-bottom:.5rem" onclick="closeModal()">Nice!</button>'
    + '<button class="btn btn-ghost" style="width:100%" onclick="unmarkDebtPaid(\''+debtId+'\');closeModal()">Undo</button>');
}
var debtPayId = null;
function openDebtPay(debtId){
  var debt = S.debts.filter(function(d){ return d.id===debtId; })[0];
  if(!debt) return;
  debtPayId = debtId;
  var due = debtDueAmount(debt);
  var paidAmt = debtPaidAmount(debt, view.y, view.m);

      + '</select></div>'
    : '';
  modal(esc(debt.name),
    '<p class="muted" style="font-size:.875rem;margin-bottom:1rem">'+usd(num(debt.balance)+(isPaid?paidAmt:0))+' total balance owed</p>'
    + '<label class="flabel">Amount</label>'
    + (isPaid
        ? ('<div class="field" style="display:flex;align-items:center;font-weight:600" aria-label="Amount, view only">'+usd(full)+'</div>'
          + '<p class="muted" style="font-size:.75rem;margin-top:.5rem">Marked paid. Mark it unpaid to change the amount or how it was paid.</p>'
          + '<div class="grid2" style="margin-top:.75rem">'
          + '<button class="btn btn-ghost" onclick="debtPayUnpay()">Mark unpaid</button>'
          + '<button class="btn btn-ghost" onclick="closeModal();openDebtForm(\''+debtId+'\')">Edit debt details</button></div>')
        : ('<div style="display:flex;gap:.5rem">'
          + '<div class="money" style="flex:1;width:auto;border-radius:.75rem;padding:0 .75rem">'
          + '<span>$</span><input id="debtPayInput" class="tnum" inputmode="decimal" value="'+full+'" style="padding:.6rem 0 .6rem .25rem;font-size:1rem" onkeydown="if(event.key===\'Enter\')debtPaySave()">'+calcBtn()+'</div>'

          + '</p>'

function getDebtPayMethod(){

}
function debtPaySave(){
  var inp = document.getElementById("debtPayInput");

}
function visibleDebtCreditItems(){
  return activeDebts().filter(function(d){
    if(d.usableAsPayment) return num(d.balance)>0 || !!d.everCarriedBalance;

}
function debtCreditCard(){
  var items = visibleDebtCreditItems();

    + '<ul class="plain">' + items.map(debtCreditRowHtml).join("") + '</ul></section>';

function debtCreditRowHtml(d){
  var due = debtFullAmountFor(d, view.y, view.m);

    + '<button class="checkbtn'+(isPaid?" paid":"")+'" aria-label="'+(isPaid?"Mark unpaid":"Mark paid")+'" onclick="toggleDebtPaid(\''+d.id+'\')">'+(isPaid?icon("check",15):"")+'</button>'
    + '<button class="bill-main" onclick="openDebtPay(\''+d.id+'\')">'
    + '<div><div class="bill-name'+(isPaid?" done":"")+'">'+esc(d.name)+'</div>'
    + '<div class="bill-cat"><span class="cat-dot" style="background:var(--pine)"></span>'+subtitle+'</div></div>'
    + '<div style="display:flex;align-items:center;gap:.5rem">'
    + '<div class="bill-amt"><div class="due tnum">'+usd(due)+'</div>'
    + '<div class="status tnum" style="color:'+(isPaid?"var(--pine)":"var(--amber)")+'">'+(isPaid?"Paid":"Due")+'</div></div>'
    + '<i class="row-chev" aria-hidden="true" style="color:var(--sub);display:flex;flex:none">'+icon("right",15)+'</i>'
    + '</div>'
    + '</button>'
    + '</div></li>';

/* A "semimonthly" bill has two independent due dates within the same month, each tracked
   separately. Occurrence 1 always uses the plain billId key (so every existing bill's saved
   "left" data keeps working untouched); occurrence 2 uses a suffixed key. */
function leftKey(billId, occ){ return (occ===1 || occ==null) ? billId : billId+":"+occ; }
function leftOf(b, data, occ){
  var d = data || md();
  var paidAmt = varPaidAmount(d, b.id, occ);
  return paidAmt===null ? num(b.estimate) : 0;
}
function dueBills(){ return billsList().filter(function(b){ return dueInMonth(b, view.m); }); }
function restOfYear(){
  var sum = 0;
  for(var m=view.m+1; m<=12; m++){
    var data = S.months[mk(view.y,m)] || emptyMonth();
    billsList().forEach(function(b){
      if(!dueInMonth(b,m)) return;
      billOccurrencesInMonth(b, view.y, m).forEach(function(occ){
        if(isSkipped(b, view.y, m, occ)) return;
        sum += leftOf(b,data,occ);
      });
    });
    fundsList().forEach(function(f){
      if(!f.active) return;
      sum += Math.max(0, fundBudgetFor(f, view.y, m) - fundSpentInMonth(f, view.y, m));
    });
    visibleDebtCreditItems().forEach(function(d){
      if(d.payoffMethod!=="fixed") return; // a "pay in full" balance can't be forecast this far out
      sum += debtLeftOf(d, view.y, m);
    });
  }
  return sum;
}

/* ---------- mutations ---------- */
function touchMonth(){
  var k = mk(view.y,view.m);
  if(!S.months[k]) S.months[k] = emptyMonth();
  if(!S.months[k].left) S.months[k].left = {};
  if(S.months[k].oneTime===undefined) S.months[k].oneTime = 0;
  if(!S.months[k].varPaid) S.months[k].varPaid = {};
  if(!S.months[k].payMethod) S.months[k].payMethod = {};
  if(!S.months[k].skipped) S.months[k].skipped = {};
  return S.months[k];
}

function togglePaid(billId, occ){
  var b = billsList().filter(function(x){return x.id===billId;})[0];
  if(!b) return;
  var isPaid = leftOf(b,null,occ)===0;
  // Checking trusts the default amount is close enough — mark it paid instantly. If it needs
  // correcting, the row is still tappable to open the form and edit the amount.
  if(!isPaid){
    var amt = num(b.estimate);
    markVariablePaid(billId, amt, occ, undefined);
    if(b.linkedGoalId) createGoalDeposit(b, view.y, view.m, occ, amt);
    showBalanceWarning(); return;
  }
  // Unpaying a goal-linked bill also deletes its logged deposit — that's worth a beat to
  // confirm, so open the pay sheet instead of doing it silently. A plain bill has nothing
  // else riding on it, so unmarking can happen in one tap.
  if(b.linkedGoalId){ openPay(billId, occ); return; }
  unmarkVariablePaid(billId, occ);
  showBalanceWarning();
}
function step(d){
  var m = view.m + d, y = view.y;
  if(m>12){ m=1; y++; } if(m<1){ m=12; y--; }
  view.m = m; view.y = y; render();
}
function go(screen){ if(screen==="data") settingsSubScreen = null; if(screen==="reports") toolsSubScreen = null; view.screen = screen; window.scrollTo(0,0); render(); }
function toggleTabHidden(key){
  var i = S.hiddenTabs.indexOf(key);
  if(i>=0) S.hiddenTabs.splice(i,1); else S.hiddenTabs.push(key);
  if(view.screen===key && S.hiddenTabs.indexOf(key)>=0){ view.screen = "month"; }
  persist(); render();
}

// A semimonthly bill counts as fully paid only once both occurrences are settled; skipped
// bills are never treated as "paid" here, so Hide Paid doesn't also hide skipped ones.
function isBillFullyPaid(b, data){
  var occs = billOccurrencesInMonth(b, view.y, view.m);
  if(occs.length===0) return false;
  return occs.every(function(occ){ return !isSkipped(b, view.y, view.m, occ) && leftOf(b,data,occ)===0; });
}
function monthVisibleBills(bills, data){
  var list = bills.slice();
  if(monthHidePaid) list = list.filter(function(b){ return !isBillFullyPaid(b, data); });
  var q = monthSearchQuery.trim().toLowerCase();
  if(q){
    list = list.filter(function(b){
      return (b.name||"").toLowerCase().indexOf(q)>=0 || (b.category||"").toLowerCase().indexOf(q)>=0;
    });
  }
  if(monthSort==="name_asc"){
    list.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
  } else if(monthSort==="amount_desc"){
    list.sort(function(a,b){ return fullAmountFor(b,data,1)-fullAmountFor(a,data,1); });
  }
  return list;
}
// Renders the bill list either as one flat list (default order or the two simple sorts
// above) or grouped into per-category sections, matching how the Bills tab groups things.
function monthBillListHtml(bills, data){
  if(monthSort!=="cat_group"){
    return '<ul class="plain">' + bills.reduce(function(acc,b){ return acc.concat(monthBillRows(b,data)); }, []).join("") + '</ul>';
  }
  var groups = S.categories.map(function(c){
    return {cat:c, bills:bills.filter(function(b){return b.category===c;})};
  }).filter(function(g){return g.bills.length>0;});
  var stray = bills.filter(function(b){return S.categories.indexOf(b.category)<0;});
  if(stray.length) groups.push({cat:"Uncategorized", bills:stray});
  return groups.map(function(g){
    return '<div class="list-head" style="margin-top:.9rem"><h3 style="font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.5rem">'
      + '<span class="cat-dot" style="background:'+catColor(g.cat)+'"></span>'+esc(g.cat)+'</h3></div>'
      + '<ul class="plain">' + g.bills.reduce(function(acc,b){ return acc.concat(monthBillRows(b,data)); }, []).join("") + '</ul>';
  }).join("");
}
function monthScreen(){

    countableBillCount++;
    var full = 0, left = 0;
    occs.forEach(function(occ){ full += fullAmountFor(b,data,occ); left += leftOf(b,data,occ); });
    totalDue += full; stillDue += left;

    + '<button style="all:unset;cursor:pointer;display:flex;align-items:center;gap:.3rem;margin-top:.7rem;color:var(--sub);font-size:.75rem;font-weight:600" onclick="moneyMathOpen=!moneyMathOpen;render()">'
    + (moneyMathOpen ? "Hide the math" : "Show the math") + ' <span style="display:flex;transform:rotate('+(moneyMathOpen?"-90":"90")+'deg)">'+icon("right",13)+'</span></button>'

          + '<span class="tnum" style="font-weight:700;color:'+(fundsLeft>0?"var(--amber)":"var(--pine)")+'">'+usd(fundsLeft)+'</span></div>' : '')
      + '<div class="divider" style="margin:.6rem 0"></div>'

// occ is either a small int (1, or 2 for semimonthly) or a date string (for payday bills).
// Embedding it into an onclick attribute needs different treatment for each — a bare number
// works as-is, but a bare date string like 2026-07-03 gets evaluated as *subtraction* by the
// browser (2026 minus 7 minus 3) instead of passed through, silently writing to a nonsense key
// unrelated to the real occurrence. Wrapping strings in single quotes (matching the convention
// used for ids elsewhere) avoids colliding with the enclosing onclick="..." attribute's own
// double quotes.
function occArg(occ){ return typeof occ === "string" ? "'"+occ+"'" : occ; }
function monthBillRow(b, data, occ, subtitle){
  var linked = !!b.linkedGoalId;
  var skipped = isSkipped(b, view.y, view.m, occ);
  var full = fullAmountFor(b, data, occ);
  var l = leftOf(b,data,occ), paid = !skipped && l===0;
  var checkOnclick = skipped ? ("openPay('"+b.id+"', "+occArg(occ)+")") : ("togglePaid('"+b.id+"', "+occArg(occ)+")");
  var statusColor = skipped ? "var(--sub)" : (paid ? "var(--pine)" : "var(--amber)");
  var statusText = skipped ? "Skipped" : (paid ? "Paid" : "Due");
  var checkAria = skipped ? "Skipped this month" : (paid ? "Mark unpaid" : "Mark paid");
  return '<li><div class="bill-li">'
    + '<button class="checkbtn'+(paid?" paid":"")+(skipped?" skipped":"")+'" aria-label="'+checkAria+'" onclick="'+checkOnclick+'">'+(skipped?icon("x",13):(paid?icon("check",15):""))+'</button>'
    + '<button class="bill-main" onclick="openPay(\''+b.id+'\', '+occArg(occ)+')">'
    + '<div><div class="bill-name'+(paid?" done":"")+'">'+esc(b.name)+(linked?' <i class="row-goal" aria-hidden="true" style="font-size:.7rem;color:var(--pine)" title="Linked to a savings goal">'+icon("target",11)+'</i>':'')+'</div>'
    + '<div class="bill-cat">'+(monthSort==="cat_group"
        ? (subtitle||'')
        : '<span class="cat-dot" style="background:'+catColor(b.category)+'"></span>'+esc(b.category)+(subtitle?' '+subtitle:''))+'</div></div>'
    + '<div style="display:flex;align-items:center;gap:.5rem">'
    + '<div class="bill-amt"><div class="due tnum">'+usd(full)+'</div>'
    + '<div class="status tnum" style="color:'+statusColor+'">'+statusText+'</div></div>'
    + '<i class="row-chev" aria-hidden="true" style="color:var(--sub);display:flex;flex:none">'+icon("right",15)+'</i>'
    + '</div>'
    + '</button>'
    + '</div></li>';
}
function monthBillRows(b, data){
  var occs = billOccurrencesInMonth(b, view.y, view.m);
  if(occs.length===0) return [];
  if(occs.length===1) return [monthBillRow(b, data, occs[0], null)];
  return occs.map(function(occ, i){ return monthBillRow(b, data, occ, "("+(i+1)+"/"+occs.length+" payments)"); });
}

function fundBudgetFor(fund, y, m){ return num(fund.budget); }
function fundSpentInMonth(fund, y, m){
  return S.journal.reduce(function(sum, e){
    if(e.fundId !== fund.id || e.adjustment) return sum;
    var d = new Date(e.date+"T00:00:00");
    if(isNaN(d)) return sum;
    if(d.getFullYear()!==y || (d.getMonth()+1)!==m) return sum;
    return sum + num(e.amount);
  }, 0);
}

    scopeSeg = '<div class="row" style="margin-bottom:1rem"><div class="seg" style="margin:0">'
      + '<button style="'+pStyle+'" class="'+(reportScope==="month"?"on":"")+'" onclick="reportScope=\'month\';render()">'+MS[view.m-1]+' '+view.y+'</button>'
      + '<button style="'+pStyle+'" class="'+(reportScope==="year"?"on":"")+'" onclick="reportScope=\'year\';render()">'+view.y+'</button>'
      + '</div></div>';
  }
  // Adding goals now lives in Settings → Setup (and the first-run onboarding wizard). Reports still
  // lets you tap a goal card to edit it, and still nudges toward Settings if none exist yet.
  var body;

  else if(reportSubMode==="savings") body = savingsReportBody();

}
function billsReportBody(){
  var byCat = {};
  function add(c,v){ byCat[c]=(byCat[c]||0)+v; }
  // Always the estimate, never what was actually paid — this report answers "what's expected
  // this period," which shouldn't change just because some of it has already been paid. Actual
  // amounts belong to the Spending report instead. Each occurrence a bill has that month (2 for
  // semimonthly, 2-3 for payday) counts separately, since they share one estimate but both cost.
  if(reportScope==="month"){
    var y1 = view.y, m1 = view.m;
    billsList().forEach(function(b){
      if(!dueInMonth(b,m1)) return;
      var occs = billOccurrencesInMonth(b,y1,m1).filter(function(occ){ return !isSkipped(b,y1,m1,occ); });
      add(b.category, num(b.estimate) * occs.length);
    });
    fundsList().forEach(function(f){ if(f.active) add(f.category, num(f.budget)); });
  }else{
    for(var m=1;m<=12;m++){
      billsList().forEach(function(b){
        if(!dueInMonth(b,m)) return;
        var occs = billOccurrencesInMonth(b,view.y,m).filter(function(occ){ return !isSkipped(b,view.y,m,occ); });
        add(b.category, num(b.estimate) * occs.length);
      });
    }
    fundsList().forEach(function(f){ if(f.active) add(f.category, num(f.budget)*12); });
  }
  var rows = Object.keys(byCat).map(function(c){return {cat:c,v:byCat[c]};}).sort(function(a,b){return b.v-a.v;});
  var total = rows.reduce(function(s,r){return s+r.v;},0);
  var income;
  if(reportScope==="month") income = monthlyIncomeFor(view.y, view.m);
  else { income = 0; for(var im=1; im<=12; im++) income += monthlyIncomeFor(view.y, im); }

  /* donut via conic-gradient */
  var stops=[], acc=0;
  rows.forEach(function(r){
    var from = total>0 ? acc/total*360 : 0;
    acc += r.v;
    var to = total>0 ? acc/total*360 : 0;
    stops.push(catColor(r.cat)+" "+from+"deg "+to+"deg");
  });
  var donutBg = stops.length ? "conic-gradient("+stops.join(",")+")" : "var(--line)";

  var h = '<section class="card pad">'
    + '<div class="donut-wrap"><div class="donut" style="background:'+donutBg+'"></div>'
    + '<div class="donut-hole"><span class="amt tnum">'+usd(total)+'</span>'
    + '<span class="cap">'+(reportScope==="month"?"expected this month":"expected this year")+'</span></div></div>';

  if(rows.length===0){
    h += '<p class="muted" style="font-size:.9rem">Nothing scheduled for this period.</p>';
  }else{
    h += rows.map(function(r){
      var pct = total>0 ? r.v/total*100 : 0;
      return '<div class="report-li">'
        + '<div class="row"><span style="display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem">'
        + '<span class="cat-dot" style="width:9px;height:9px;background:'+catColor(r.cat)+'"></span>'+esc(r.cat)+'</span>'
        + '<span class="tnum" style="font-size:.875rem"><b>'+usd(r.v)+'</b> <span class="muted" style="font-size:.75rem">'+Math.round(pct)+'%</span></span></div>'
        + '<div class="cat-bar"><div class="fill" style="width:'+pct+'%;background:'+catColor(r.cat)+'"></div></div>'
        + '</div>';
    }).join("");
  }
  var diff = income-total;
  h += '<div class="divider"></div><div class="row" style="font-size:.875rem">'
    + '<span class="muted">vs. income of '+usd(income)+'</span>'
    + '<span class="tnum" style="font-weight:700;color:'+(diff>=0?"var(--pine)":"var(--red)")+'">'
    + (diff>=0 ? usd(diff)+" left over" : usd(-diff)+" over")+'</span></div>'
    + '</section>'
    + '<p class="muted" style="font-size:.75rem;text-align:center;padding:0 1rem">Estimated amounts, whether or not they\'ve been paid yet — active bills (and each of their payments, for anything due more than once a month) at their default amount, active funds at their monthly budget, cash funds included. Paused bills, paused funds, and skipped payments aren\'t counted. See actual spending in the Spending report instead.</p>';
  return h;
}

function savingsReportBody(){
  if(!S.savingsGoals.length){
    return '<section class="card pad"><h2 class="eyebrow">Set a savings goal</h2>'
      + '<p class="muted" style="font-size:.875rem;margin-bottom:.9rem">Give it a name and a target, then log deposits from the Log tab. You can add up to 5 goals.</p>'
      + '<button class="btn btn-pine" style="width:100%" onclick="openGoalForm(null)">Set a goal</button>'
      + '</section>';
  }

  // Period-scoped activity — separate from the all-time goal progress below, since a goal's
  // saved total is inherently cumulative and shouldn't reset with the period picker.
  var period = histMonthsAndLabel();
  var inRange = {};
  period.months.forEach(function(pair){ inRange[pair[0]+"-"+pair[1]] = true; });
  var deposited = 0, withdrawn = 0;
  S.savingsEntries.forEach(function(e){
    var d = new Date(e.date+"T00:00:00");
    if(isNaN(d)) return;
    if(!inRange[d.getFullYear()+"-"+(d.getMonth()+1)]) return;

  var h = '<button class="field row" style="cursor:pointer;margin-bottom:.75rem" onclick="openHistPeriodSheet()">'

    + '<section class="card pad">'
    + '<div class="row"><span class="muted" style="font-size:.85rem">Deposited</span><span class="tnum" style="font-weight:700;color:var(--pine)">'+usd(deposited)+'</span></div>'
    + (withdrawn ? '<div class="row" style="margin-top:.3rem"><span class="muted" style="font-size:.85rem">Withdrawn</span><span class="tnum" style="font-weight:700;color:var(--red)">'+usd(withdrawn)+'</span></div>' : '')

  /* Net total + pie breakdown by goal. Entries whose goal was since deleted still count

     cumulative by nature. */
  var trackedIds = S.savingsGoals.map(function(g){ return g.id; });
  var pieRows = S.savingsGoals.map(function(g,i){
    return { name:g.name, v:savingsTotalFor(g.id), color:CHART_COLORS[i % CHART_COLORS.length] };
  });
  var otherTotal = S.savingsEntries.reduce(function(s,e){
    if(trackedIds.indexOf(e.goalId)>=0) return s;
    return s + (e.type==="withdrawal" ? -num(e.amount) : num(e.amount));
  },0);
  if(otherTotal!==0) pieRows.push({ name:"Other", v:otherTotal, color:"var(--sub)" });
  var netTotal = pieRows.reduce(function(s,r){ return s+r.v; },0);
  var pieTotal = pieRows.reduce(function(s,r){ return s+Math.max(0,r.v); },0);

  var stops=[], acc=0;
  pieRows.forEach(function(r){
    var val = Math.max(0,r.v);
    var from = pieTotal>0 ? acc/pieTotal*360 : 0;
    acc += val;
    var to = pieTotal>0 ? acc/pieTotal*360 : 0;
    stops.push(r.color+" "+from+"deg "+to+"deg");
  });
  var donutBg = stops.length && pieTotal>0 ? "conic-gradient("+stops.join(",")+")" : "var(--line)";

  h += '<section class="card pad" style="margin-top:.9rem">'
    + '<h2 class="eyebrow">All time</h2>'
    + '<div class="donut-wrap"><div class="donut" style="background:'+donutBg+'"></div>'
    + '<div class="donut-hole"><span class="amt tnum">'+usd(netTotal)+'</span>'
    + '<span class="cap">net saved</span></div></div>';
  h += pieRows.map(function(r){
    var pct = pieTotal>0 ? Math.max(0,r.v)/pieTotal*100 : 0;
    return '<div class="row" style="font-size:.8rem;padding:.25rem 0">'
      + '<span style="display:flex;align-items:center;gap:.5rem;font-weight:600">'
      + '<span class="cat-dot" style="width:9px;height:9px;background:'+r.color+'"></span>'+esc(r.name)+'</span>'
      + '<span class="tnum">'+usd(r.v)+' <span class="muted" style="font-size:.72rem">'+Math.round(pct)+'%</span></span></div>';
  }).join("");
  h += '</section>';

  h += '<section class="card">';
  S.savingsGoals.forEach(function(g, i){
    var saved = savingsTotalFor(g.id);
    var target = num(g.target);
    var pct = target>0 ? Math.max(0, Math.min(100, saved/target*100)) : 0;
    var reached = target>0 && saved>=target;
    h += (i>0 ? '<div class="divider"></div>' : '')
      + '<button style="width:100%;text-align:left;display:block;padding:.85rem 1rem'+(i===0?' 0':'')+'" onclick="openGoalForm(\''+g.id+'\')">'
      + '<div class="row" style="margin-bottom:.4rem">'
      + '<span style="font-weight:600;font-size:.9rem">'+esc(g.name)+(reached?' 🎉':'')+'</span>'
      + '<span class="tnum" style="font-weight:700;font-size:.9rem;color:'+(reached?"var(--pine)":"var(--ink)")+'">'+usd(saved)+' <span class="muted" style="font-weight:500">of '+usd(target)+'</span></span>'
      + '</div>'
      + '<div class="cat-bar"><div class="fill" style="width:'+pct+'%;background:var(--pine)"></div></div>'
      + '<div class="track-caption">'
      + (reached
          ? '<span style="color:var(--pine);font-weight:600">Goal reached!</span><span class="tnum muted">'+usd(saved-target)+' over target</span>'
          : '<span>'+Math.round(pct)+'% there</span><span class="tnum">'+usd(target-saved)+' to go</span>')
      + '</div>'
      + '</button>';
  });
  h += '</section>';
  if(S.savingsGoals.length>=5){
    h += '<p class="muted" style="font-size:.75rem;text-align:center;padding:0 1rem">You’ve reached the 5-goal limit. Delete or rename an existing goal to make room for a new one.</p>';
  }
  return h;
}

/* Active funds' monthly budgets, summed per category (a category can have more than one
   fund in theory, though the UI steers toward one). Used to show budget context on the
   spending report — funds are just a cap on a category, not a separate transaction type,
   so the actual spending already lives in the journal entries below. */
/* ---------- Spending/Savings lookback period ----------
   Bills and Debts reports are snapshots of current reality (what's configured right now), so
   they stay tied to reportScope and the currently-viewed month. Spending and Savings are logs
   of things that actually happened, so they get their own independent period picker instead —
   any single past month, a whole year, a trailing window, or an arbitrary month/year via
   "Custom". Returns the list of [y,m] pairs to include and a label to display. */
function histMonthsAndLabel(){
  var y = view.y, m = view.m;
  if(histPeriod==="year") return { months: monthRange(y,1,y,12), label: String(y) };
  if(histPeriod==="last3" || histPeriod==="last6" || histPeriod==="last12"){
    var n = histPeriod==="last3" ? 3 : (histPeriod==="last6" ? 6 : 12);
    var months = [], cy=y, cm=m;
    for(var i=0;i<n;i++){ months.unshift([cy,cm]); cm--; if(cm<1){ cm=12; cy--; } }
    return { months: months, label: "Last "+n+" months" };
  }
  if(histPeriod==="custom"){
    if(histCustomM) return { months:[[histCustomY,histCustomM]], label: MS[histCustomM-1]+" "+histCustomY };
    return { months: monthRange(histCustomY,1,histCustomY,12), label: String(histCustomY) };
  }
  return { months:[[y,m]], label: MS[m-1]+" "+y };
}
function monthRange(y1,m1,y2,m2){
  var months = [], y=y1, m=m1;
  while(y<y2 || (y===y2 && m<=m2)){ months.push([y,m]); m++; if(m>12){ m=1; y++; } }
  return months;
}
function histPeriodLabel(key){
  return { month:"This month", year:"This year", last3:"Last 3 months", last6:"Last 6 months", last12:"Last 12 months" }[key] || histMonthsAndLabel().label;
}
function openHistPeriodSheet(){
  var opts = [["month","This month"],["year","This year"],["last3","Last 3 months"],["last6","Last 6 months"],["last12","Last 12 months"]];
  modal("Time period",

      var on = histPeriod===o[0];
      return '<li><button class="bill-li" style="width:100%;text-align:left" onclick="setHistPeriod(\''+o[0]+'\')">'
        + '<span style="flex:1;font-weight:'+(on?"700":"500")+';color:'+(on?"var(--pine)":"var(--ink)")+'">'+o[1]+'</span>'
        + (on ? icon("check",18) : '') + '</button></li>';
    }).join("")
    + '<li><button class="bill-li" style="width:100%;text-align:left" onclick="openHistCustomPicker()">'
      + '<span style="flex:1;font-weight:'+(histPeriod==="custom"?"700":"500")+';color:'+(histPeriod==="custom"?"var(--pine)":"var(--ink)")+'">Custom month or year…</span>'
      + (histPeriod==="custom" ? icon("check",18) : '') + '</button></li>'
    + '</ul>');

function setHistPeriod(key){ histPeriod = key; closeModal(); render(); }
function openHistCustomPicker(){

    + '<select id="histMonthSel" class="field">'

function applyHistCustom(){
  var yEl = document.getElementById("histYearSel"), mEl = document.getElementById("histMonthSel");
  histCustomY = num(yEl.value);
