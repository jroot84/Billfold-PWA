function fundBudgetByCategory(months){
  var byCat = {};
  fundsList().forEach(function(f){
    if(!f.active) return;
    var monthly = num(f.budget);
    byCat[f.category] = (byCat[f.category]||0) + monthly*months.length;
  });
  return byCat;
}
function journalRowsForScope(months){
  var inRange = {};
  months.forEach(function(pair){ inRange[pair[0]+"-"+pair[1]] = true; });
  var byCat = {};
  function add(c,v){ byCat[c]=(byCat[c]||0)+v; }
  S.journal.forEach(function(e){
    var d = new Date(e.date+"T00:00:00");
    if(isNaN(d)) return;
    var ey=d.getFullYear(), em=d.getMonth()+1;
    if(inRange[ey+"-"+em]) add(e.category||"Uncategorized", num(e.amount));
  });
  var budgets = fundBudgetByCategory(months);
  /* Include categories with a fund budget but no spending yet, so a fresh fund still shows up. */
  Object.keys(budgets).forEach(function(c){ if(!(c in byCat)) byCat[c] = 0; });
  return Object.keys(byCat).map(function(c){
    return { cat:c, v:byCat[c], budget: (c in budgets) ? budgets[c] : null };
  }).sort(function(a,b){ return b.v-a.v; });
}
function donutBgFor(rows,total){
  var stops=[], acc=0;
  rows.forEach(function(r){
    var from = total>0 ? acc/total*360 : 0;
    acc += r.v;
    var to = total>0 ? acc/total*360 : 0;
    stops.push(catColor(r.cat)+" "+from+"deg "+to+"deg");
  });
  return stops.length ? "conic-gradient("+stops.join(",")+")" : "var(--line)";
}
function categoryListHtml(rows,total){
  if(rows.length===0) return '<p class="muted" style="font-size:.9rem">Nothing logged for this period.</p>';
  return rows.map(function(r){
    var hasBudget = r.budget!==null && r.budget!==undefined;
    if(hasBudget){
      var over = r.budget>0 && r.v>r.budget;
      var pct = r.budget>0 ? Math.max(0, Math.min(100, r.v/r.budget*100)) : 0;
      var barColor = over ? "var(--red)" : catColor(r.cat);
      return '<div class="report-li">'
        + '<div class="row"><span style="display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem">'
        + '<span class="cat-dot" style="width:9px;height:9px;background:'+catColor(r.cat)+'"></span>'+esc(r.cat)+'</span>'
        + '<span class="tnum" style="font-size:.875rem"><b style="color:'+(over?"var(--red)":"inherit")+'">'+usd(r.v)+'</b> <span class="muted" style="font-size:.75rem">of '+usd(r.budget)+' budgeted</span></span></div>'
        + '<div class="cat-bar"><div class="fill" style="width:'+pct+'%;background:'+barColor+'"></div></div>'
        + '</div>';
    }
    var pct2 = total>0 ? r.v/total*100 : 0;
    return '<div class="report-li">'
      + '<div class="row"><span style="display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem">'
      + '<span class="cat-dot" style="width:9px;height:9px;background:'+catColor(r.cat)+'"></span>'+esc(r.cat)+'</span>'
      + '<span class="tnum" style="font-size:.875rem"><b>'+usd(r.v)+'</b> <span class="muted" style="font-size:.75rem">'+Math.round(pct2)+'%</span></span></div>'
      + '<div class="cat-bar"><div class="fill" style="width:'+pct2+'%;background:'+catColor(r.cat)+'"></div></div>'
      + '</div>';
  }).join("");
}

/* ---------- calculator engine (used by the popup calculator) ---------- */
function fmtNum(n){
  if(!isFinite(n)) return "Error";
  var r = Math.round(n*1e10)/1e10;
  return r.toLocaleString("en-US", { maximumFractionDigits:10 });
}
function fmtEntry(s){
  if(s === "" || s === "-") return s === "-" ? "-0" : "0";
  var neg = s.charAt(0) === "-";
  var body = neg ? s.slice(1) : s;
  var parts = body.split(".");
  var intp = (parts[0] || "0").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  var out = intp + (parts.length > 1 ? "." + parts[1] : "");
  return (neg ? "-" : "") + out;
}
function opSym(op){ return op === "*" ? "×" : op === "/" ? "÷" : op === "-" ? "−" : "+"; }
function applyOp(a, op, b){
  a = +a; b = +b;
  if(op === "+") return a + b;
  if(op === "-") return a - b;
  if(op === "*") return a * b;
  if(op === "/") return b === 0 ? NaN : a / b;
  return b;
}
function histHtml(){
  if(!activeCalc.history.length){
    return '<p class="muted" style="font-size:.75rem;text-align:center;padding:.15rem 0 0">Recent results will show here — tap one to reuse it.</p>';
  }
  return activeCalc.history.slice(-8).reverse().map(function(h){
    return '<button class="calc-chip" onclick="calcUseResult('+h.result+')">'+esc(h.expr)+' = <b>'+esc(fmtNum(h.result))+'</b></button>';
  }).join("");
}
function keypad(){
  function b(label, fn, cls, span){
    return '<button class="calc-btn '+(cls||"")+'"'+(span?' style="grid-column:span '+span+'"':'')+' onclick="'+fn+'">'+label+'</button>';
  }
  return '<div class="keys">'
    + b("C","calcClear()","fn") + b("⌫","calcBack()","fn") + b("%","calcPercent()","fn") + b("÷","calcOp('/')","op")
    + b("7","calcDigit('7')") + b("8","calcDigit('8')") + b("9","calcDigit('9')") + b("×","calcOp('*')","op")
    + b("4","calcDigit('4')") + b("5","calcDigit('5')") + b("6","calcDigit('6')") + b("−","calcOp('-')","op")
    + b("1","calcDigit('1')") + b("2","calcDigit('2')") + b("3","calcDigit('3')") + b("+","calcOp('+')","op")
    + b("0","calcDigit('0')",null,2) + b(".","calcDot()") + b("=","calcEquals()","eq")
    + '</div>';
}
function fitDisplay(el){
  if(!el) return;
  el.style.fontSize = "";
  if(!el.clientWidth) return;
  var size = 2.1, guard = 0;
  el.style.fontSize = size + "rem";
  while(el.scrollWidth > el.clientWidth && size > 0.9 && guard < 30){
    size -= 0.1;
    el.style.fontSize = size.toFixed(2) + "rem";
    guard++;
  }
}
function calcRefresh(){
  var d = document.getElementById("calcDisplay");
  if(d){ d.textContent = fmtEntry(activeCalc.entry); fitDisplay(d); }
  var t = document.getElementById("calcTop");
  if(t) t.textContent = (activeCalc.acc !== null && activeCalc.pending) ? fmtNum(activeCalc.acc)+" "+opSym(activeCalc.pending) : "";
  var h = document.getElementById("calcHistWrap");
  if(h) h.innerHTML = histHtml();
}
/* Full keypad calculator shown inline as the Tools tab's "Calculator" segment. */
function calcInlineScreen(){
  var keys = keypad();
  var top = (activeCalc.acc !== null && activeCalc.pending) ? fmtNum(activeCalc.acc)+" "+opSym(activeCalc.pending) : "";
  return '<section class="card pad">'
    + '<div class="calc-top" id="calcTop">'+esc(top)+'</div>'
    + '<div class="calc-display" id="calcDisplay">'+esc(fmtEntry(activeCalc.entry))+'</div>'
    + '</section>'
    + '<div class="calc-hist" id="calcHistWrap">'+histHtml()+'</div>'
    + '<section class="card pad">'+keys+'</section>';
}
function calcDigit(d){
  if(activeCalc.justEq){ activeCalc.entry = "0"; activeCalc.justEq = false; }
  if(activeCalc.entry === "Error") activeCalc.entry = "0";
  activeCalc.entry = (activeCalc.entry === "0") ? d : activeCalc.entry + d;
  calcRefresh();
}
function calcDot(){
  if(activeCalc.justEq){ activeCalc.entry = "0"; activeCalc.justEq = false; }
  if(activeCalc.entry === "Error") activeCalc.entry = "0";
  if(activeCalc.entry.indexOf(".") < 0) activeCalc.entry += ".";
  calcRefresh();
}
function calcBack(){
  if(activeCalc.justEq){ return; }
  var e = activeCalc.entry;
  e = (e.length > 1) ? e.slice(0, -1) : "0";
  if(e === "-" || e === "") e = "0";
  activeCalc.entry = e;
  calcRefresh();
}
function calcClear(){
  activeCalc.acc = null; activeCalc.pending = null; activeCalc.entry = "0"; activeCalc.justEq = false;
  calcRefresh();
}
function calcOp(op){
  var cur = parseFloat(activeCalc.entry) || 0;
  if(activeCalc.pending !== null && !activeCalc.justEq){
    activeCalc.acc = applyOp(activeCalc.acc, activeCalc.pending, cur);
  } else {
    activeCalc.acc = cur;
  }
  activeCalc.pending = op;
  activeCalc.entry = "0";
  activeCalc.justEq = false;
  calcRefresh();
}
function calcEquals(){
  if(activeCalc.pending === null) return;
  var cur = parseFloat(activeCalc.entry) || 0;
  var left = activeCalc.acc === null ? 0 : activeCalc.acc;
  var result = applyOp(left, activeCalc.pending, cur);
  var expr = fmtNum(left) + " " + opSym(activeCalc.pending) + " " + fmtNum(cur);
  if(isFinite(result)){
    activeCalc.history.push({ expr:expr, result:result });
    if(activeCalc.history.length > 30) activeCalc.history.shift();
  }
  activeCalc.acc = null;
  activeCalc.pending = null;
  activeCalc.entry = isFinite(result) ? String(result) : "Error";
  activeCalc.justEq = true;
  calcRefresh();
}
function calcPercent(){
  var cur = parseFloat(activeCalc.entry) || 0;
  if(activeCalc.pending !== null && activeCalc.acc !== null){
    cur = activeCalc.acc * cur / 100;
  } else {
    cur = cur / 100;
  }
  activeCalc.entry = String(cur);
  activeCalc.justEq = false;
  calcRefresh();
}
function calcUseResult(v){
  activeCalc.entry = String(v);
  activeCalc.justEq = true;
  calcRefresh();
}

/* ---------- popup calculator attached to a money input ---------- */
function calcBtn(){
  return '<button type="button" class="calcbtn" tabindex="-1" aria-label="Open calculator" onclick="openCalcForInput(this)">'+icon("calc",16)+'</button>';
}
function calcResolve(st){
  var cur = parseFloat(st.entry) || 0;
  if(st.pending !== null) return applyOp(st.acc, st.pending, cur);
  return cur;
}
// targetInput: an <input> to write the result back into, or null for a standalone scratch calculator.
function openCalcModal(targetInput){
  calcTargetInput = targetInput || null;
  var start = targetInput ? (targetInput.value || "").replace(/[^0-9.]/g, "") : "0";
  padState = { acc:null, pending:null, entry:(start === "" || start === ".") ? "0" : start, justEq:true, history: calcState.history.slice() };
  activeCalc = padState;
  var keys = keypad();
  var footer = calcTargetInput
    ? '<div class="grid2" style="margin-top:.75rem">'
      + '<button class="btn btn-ghost" onclick="cancelCalcModal()">Cancel</button>'
      + '<button class="btn btn-pine" onclick="applyCalcToInput()">Use result</button>'
      + '</div>'
    : '<button class="btn btn-pine" style="width:100%;margin-top:.75rem" onclick="cancelCalcModal()">Done</button>';
  document.getElementById("calcModalRoot").innerHTML =
    '<div class="overlay" style="z-index:60" onclick="if(event.target===this)cancelCalcModal()">'
    + '<div class="sheet"><div class="sheet-head"><h2>Calculator</h2>'
    + '<button aria-label="Close" style="color:var(--sub);padding:.3rem" onclick="cancelCalcModal()">'+icon("x",20)+'</button></div>'
    + '<div class="calc-top" id="calcTop"></div>'
    + '<div class="calc-display" id="calcDisplay">0</div>'
    + '<div class="calc-hist" id="calcHistWrap" style="margin-top:.4rem"></div>'
    + '<div style="margin-top:.5rem">'+keys+'</div>'
    + footer
    + '</div></div>';
  calcRefresh();
}
function openCalcForInput(btn){
  var inp = btn.parentNode.querySelector("input");
  if(!inp) return;
  openCalcModal(inp);
}
function cancelCalcModal(){
  if(padState) calcState.history = padState.history.slice();
  document.getElementById("calcModalRoot").innerHTML = "";
  activeCalc = calcState; calcTargetInput = null; padState = null;
}
function applyCalcToInput(){
  var val = calcResolve(activeCalc);
  if(!isFinite(val)) val = 0;
  val = Math.round(val * 100) / 100;
  var inp = calcTargetInput;
  if(padState) calcState.history = padState.history.slice();
  document.getElementById("calcModalRoot").innerHTML = "";
  activeCalc = calcState; calcTargetInput = null; padState = null;
  if(inp){
    inp.value = String(val);
    inp.dispatchEvent(new Event("change", { bubbles:true }));
  }
}
// Keyboard support for the popup calculator (helpful on laptops/desktops).
function calcKeydown(e){
  if(!padState) return;
  var k = e.key;
  if(k >= "0" && k <= "9"){ calcDigit(k); e.preventDefault(); }
  else if(k === "."){ calcDot(); e.preventDefault(); }
  else if(k === "+" || k === "-" || k === "*" || k === "/"){ calcOp(k); e.preventDefault(); }
  else if(k === "%"){ calcPercent(); e.preventDefault(); }
  else if(k === "="){ calcEquals(); e.preventDefault(); }
  else if(k === "Enter"){ applyCalcToInput(); e.preventDefault(); }
  else if(k === "Backspace"){ calcBack(); e.preventDefault(); }
  else if(k === "Escape"){ cancelCalcModal(); e.preventDefault(); }
}

/* ---------- Investment calculator ---------- */
function setCalc(key, val){
  if(key==="freq") S.calc.freq = val;
  else S.calc[key] = num(val);
  persist();
  render();
}
function projectCalc(){
  var start = num(S.calc.start), c = num(S.calc.contrib), rate = num(S.calc.rate)/100;
  var yrs = Math.max(1, Math.min(60, Math.round(num(S.calc.years)) || 1));
  var mRate = rate/12;
  var bal = start, contributed = start;
  var balSeries = [start], contribSeries = [start];
  for(var y=1; y<=yrs; y++){
    for(var mo=1; mo<=12; mo++){
      bal = bal*(1+mRate);
      if(S.calc.freq==="monthly"){ bal += c; contributed += c; }
      else if(mo===12){ bal += c; contributed += c; }
    }
    balSeries.push(bal); contribSeries.push(contributed);
  }
  return { balSeries:balSeries, contribSeries:contribSeries, yrs:yrs,
    finalBalance:bal, contributed:contributed, growth:bal-contributed };
}
function growthChart(p){
  var W=328, H=180, padL=6, padR=6, padT=14, padB=24;
  var maxY = p.finalBalance>0 ? p.finalBalance : 1;
  var baseline = H-padB;
  var xi = function(i){ return padL + (i/p.yrs)*(W-padL-padR); };
  var yi = function(v){ return baseline - (v/maxY)*(H-padT-padB); };
  function area(series){
    var d = "M "+xi(0).toFixed(1)+","+baseline;
    for(var i=0;i<series.length;i++) d += " L "+xi(i).toFixed(1)+","+yi(series[i]).toFixed(1);
    d += " L "+xi(p.yrs).toFixed(1)+","+baseline+" Z";
    return d;
  }
  function line(series){
    var d = "";
    for(var i=0;i<series.length;i++) d += (i?" L ":"M ")+xi(i).toFixed(1)+","+yi(series[i]).toFixed(1);
    return d;
  }
  var nowYear = view.y;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" preserveAspectRatio="xMidYMid meet">'
    + '<path d="'+area(p.balSeries)+'" fill="var(--pine-soft)"/>'
    + '<path d="'+area(p.contribSeries)+'" fill="#CFE3D8"/>'
    + '<path d="'+line(p.balSeries)+'" fill="none" stroke="var(--pine)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<path d="'+line(p.contribSeries)+'" fill="none" stroke="#7FA890" stroke-width="1.5" stroke-dasharray="3 3"/>'
    + '<text x="'+padL+'" y="'+(H-7)+'" font-size="10" fill="var(--sub)">'+nowYear+'</text>'
    + '<text x="'+(W-padR)+'" y="'+(H-7)+'" font-size="10" fill="var(--sub)" text-anchor="end">'+(nowYear+p.yrs)+'</text>'
    + '</svg>';
}
function calcField(label, key, prefix, suffix){
  return '<div class="fgroup"><label class="flabel">'+label+'</label>'
    + '<div class="money" style="width:auto;border-radius:.75rem;padding:0 .75rem">'
    + (prefix?'<span>'+prefix+'</span>':'')
    + '<input class="tnum" inputmode="decimal" value="'+esc(String(S.calc[key]))+'" '
    + 'style="padding:.6rem .25rem;text-align:left;font-size:1rem" '

    + (suffix?'<span style="white-space:nowrap">'+suffix+'</span>':'')

}
function investScreen(){

  return h;

function fmtDateLabel(iso){

/* --- linking a journal entry to a bill (reuses the same paid/left tracking as the Month screen) --- */
function monthDataAt(y,m){ return S.months[mk(y,m)] || emptyMonth(); }
function billLeftAt(y,m,billId,occ){
  var bill = billsList().filter(function(b){ return b.id===billId; })[0];
  if(!bill) return 0;
  var data = monthDataAt(y,m);
  return leftOf(bill, data, occ);
}
/* Shared by every automatic balance reduction (marking a bill paid, an Unplanned entry's
   optional toggle). Available now can't be pushed below $0 by an automatic action — it clamps
   there instead, and flags a warning for the next render to surface, since a silent clamp
   would otherwise hide the fact that the real balance is likely lower than what's shown. */
var balanceWarning = null;
function subtractBalanceAt(y, m, amount){
  if(!amount) return;
  var k = mk(y,m);
  if(!S.months[k]) S.months[k] = emptyMonth();
  var cur = num(S.months[k].balance);
  var next = num(cur - amount);
  if(next < 0){
    S.months[k].balance = 0;
    balanceWarning = "Available now didn't have enough to cover this — it would have gone to "+usd(next)+", so it's been capped at $0 instead. Your real balance is likely lower than what's shown; worth double-checking and updating it if so.";
  } else {
    S.months[k].balance = next;
  }
}
// payMethod: "available" (default), "none", or a debtId from paymentOptions(). Always fully
// reverses whatever was previously paid (from whichever method that used) and reapplies the new
// paid amount to the new method — simpler and more robust than tracking a delta once the method
// itself can change, and mathematically identical to the old delta-based math when it doesn't.
/* Variable bills are paid in one shot: enter the real amount, mark it paid, done — there's no
   ongoing "amount owed" to chip away at. Marking paid (or correcting an already-paid amount)
   moves Available now by whatever the change actually is; unmarking credits back exactly what
   was charged. This is the one place that distinction lives; everything else just reads
   leftOf/fullAmountFor. */
/* Variable bills are paid in one shot: enter the real amount, mark it paid, done — there's no
   ongoing "amount owed" to chip away at. Marking paid (or correcting an already-paid amount)
   moves Available now (or a credit balance) by whatever the change actually is; unmarking
   reverses exactly that. This is the one place that distinction lives; everything else just
   reads leftOf/fullAmountFor. */
function markVariablePaidAt(y, m, billId, amount, occ, payMethod){
  var b = billsList().filter(function(x){return x.id===billId;})[0];
  if(!b) return;
  var k = mk(y,m);
  if(!S.months[k]) S.months[k] = emptyMonth();
  var data = S.months[k];
  if(!data.varPaid) data.varPaid = {};
  if(!data.payMethod) data.payMethod = {};
  var key = leftKey(billId, occ||1);
  var wasPaid = varPaidAmount(data, billId, occ);
  var newVal = Math.max(0, num(amount));
  var oldMethod = data.payMethod[key] || (b.linkedGoalId ? null : b.defaultPayMethod) || "available";
  var newMethod = payMethod || oldMethod;
  if(wasPaid) reversePaymentEffect(y, m, oldMethod, wasPaid);
  if(newVal) applyPaymentEffect(y, m, newMethod, newVal);
  data.varPaid[key] = newVal;
  data.payMethod[key] = newMethod;
  return newMethod;
}
function markVariablePaid(billId, amount, occ, payMethod){
  var method = markVariablePaidAt(view.y, view.m, billId, amount, occ, payMethod);
  persist(); render();
  if(S.remindersOn) scheduleRemindersDebounced();
  return method;
}
// "Mark unpaid" for a variable bill: reverses whatever was charged (to whichever method that
// was) and reverts to showing the estimate again.
function unmarkVariablePaidAt(y, m, billId, occ){
  var b = billsList().filter(function(x){return x.id===billId;})[0];
  if(!b) return;
  var k = mk(y,m);
  if(!S.months[k]) S.months[k] = emptyMonth();
  var data = S.months[k];
  if(!data.varPaid) data.varPaid = {};
  if(!data.payMethod) data.payMethod = {};
  var key = leftKey(billId, occ||1);
  var paidAmt = varPaidAmount(data, billId, occ);
  var method = data.payMethod[key] || "available";
  if(paidAmt) reversePaymentEffect(y, m, method, paidAmt);
  delete data.varPaid[key];
  delete data.payMethod[key];
}
function unmarkVariablePaid(billId, occ){
  unmarkVariablePaidAt(view.y, view.m, billId, occ);
  persist(); render();
  if(S.remindersOn) scheduleRemindersDebounced();
}
/* Optional convenience for "Unplanned" spending entries: reduce that month's Available-now
   balance by the same amount, so a one-off expense doesn't need a second manual edit. */
function applyBalanceAdjust(entry){
  if(!entry.balanceAdjust) return;
  subtractBalanceAt(entry.balanceAdjust.y, entry.balanceAdjust.m, num(entry.balanceAdjust.amount));
}
function revertBalanceAdjust(entry){
  if(!entry.balanceAdjust) return;
  var k = mk(entry.balanceAdjust.y, entry.balanceAdjust.m);
  if(!S.months[k]) S.months[k] = emptyMonth();
  S.months[k].balance = num(num(S.months[k].balance) + num(entry.balanceAdjust.amount));
}

// Shows what's left in a fund for the entry's month, so you can see it before hitting save
// instead of having to guess or go check the Bills tab. Backs out this same entry's own prior
// amount when editing, so it reads what would be left after this save, not double-counted.
function jfFundBalance(fundId, date){
  var fund = fundsList().filter(function(f){ return f.id===fundId; })[0];
  if(!fund) return "";
  var prev = jEditId ? S.journal.filter(function(x){ return x.id===jEditId; })[0] : null;
  var fd = new Date(date+"T00:00:00");
  if(isNaN(fd)) return "";
  var fy = fd.getFullYear(), fm = fd.getMonth()+1;
  var spentSoFar = fundSpentInMonth(fund, fy, fm);
  if(prev && prev.fundId===fund.id && !prev.unplanned){
    var prevD = new Date(prev.date+"T00:00:00");
    if(!isNaN(prevD) && prevD.getFullYear()===fy && (prevD.getMonth()+1)===fm) spentSoFar -= num(prev.amount);
  }
  var remaining = num(fund.budget) - spentSoFar;
  return usd(remaining) + " left this month" + (remaining<0 ? " (already over budget)" : "");
}

// Reverses whatever effect a saved entry actually had, whichever shape it was saved under —
// the old always-on balance toggle, the old direct-debt-payment mode, or the current
// chargeMethod field. Shared by jfSave (replacing a prior save) and jfDelete.
function jfRevertEntry(e){
  if(!e) return;
  if(e.balanceAdjust) revertBalanceAdjust(e);
  if(e.debtId) revertDebtExtraPayment(e.debtId, num(e.amount)); // legacy entries only
  if(e.chargeMethod && e.chargeMethod!=="available" && e.chargeMethod!=="none") unchargeDebt(e.chargeMethod, num(e.amount));
}
function jfSave(){
  var name = document.getElementById("jfName").value.trim();
  var amount = num(document.getElementById("jfAmount").value);
  var date = document.getElementById("jfDate").value;
  var err = document.getElementById("jfErr");
  function fail(m){ err.innerHTML=m; err.style.display="block"; }
  if(!name) return fail("Give it a short name.");
  if(!amount) return fail("Enter an amount above zero.");
  if(!date) return fail("Pick a date.");

  var prev = jEditId ? S.journal.filter(function(x){ return x.id===jEditId; })[0] : null;

  var fundId = document.getElementById("jfFund").value;
  var unplannedEl = document.getElementById("jfUnplanned");
  var unplanned = !!(unplannedEl && unplannedEl.getAttribute("data-on")==="1");
  var fund = fundsList().filter(function(f){ return f.id===fundId; })[0];
  if(!fund) return fail("Pick a fund — every spending entry ties to one.");

  if(!unplanned){
    var fd = new Date(date+"T00:00:00");
    var fy = fd.getFullYear(), fm = fd.getMonth()+1;
    var spentSoFar = fundSpentInMonth(fund, fy, fm);
    // Editing an entry already counted (not-unplanned) toward this same fund/month? Back its
    // old amount out first so we're checking the real delta, not double-counting it.
    if(prev && prev.fundId===fund.id && !prev.unplanned){
      var prevD = new Date(prev.date+"T00:00:00");
      if(!isNaN(prevD) && prevD.getFullYear()===fy && (prevD.getMonth()+1)===fm) spentSoFar -= num(prev.amount);
    }
    var remaining = num(fund.budget) - spentSoFar;
    if(amount - remaining > 0.005){
      return fail("That's "+usd(amount-remaining)+" more than "+esc(fund.name)+" has left this month ("+usd(Math.max(0,remaining))+" remaining). Check \u201cUnplanned\u201d to log it without pushing the fund below $0.");
    }
  }

  jfRevertEntry(prev);

  var methodSel = document.getElementById("jfMethodSel");
  var method = fund.cashFund ? "none" : (methodSel ? methodSel.value : "available");
  var d = new Date(date+"T00:00:00");
  var balanceAdjust = null;
  if(method==="available") balanceAdjust = { y:d.getFullYear(), m:d.getMonth()+1, amount:amount };
  var entry = { id: jEditId || ("j"+Date.now()), name:name, amount:amount, date:date, fundId:fund.id, debtId:null, unplanned:unplanned, category:fund.category, balanceAdjust:balanceAdjust, chargeMethod:method };
  if(method==="available") applyBalanceAdjust(entry);
  else if(method!=="none") chargeDebt(method, amount, d.getFullYear(), d.getMonth()+1);

  var found = false;
  S.journal = S.journal.map(function(x){ if(x.id===entry.id){ found=true; return entry; } return x; });
  if(!found) S.journal.push(entry);

  persist(); closeModal(); render();
  showBalanceWarning();
}

/* --- savings goals (up to 5) ---
   Migration note: pre-multi-goal saves had a single S.savingsGoal object and untagged
   S.savingsEntries. migrateSavingsGoals() converts that into S.savingsGoals (an array) and
   tags every legacy entry with the new goal's id, so no deposit history is lost. It's driven
   off the presence of the OLD `savingsGoal` key (not the absence of the new one) so it also
   fires when restoring an older-format backup file, not just on first boot. */
function migrateSavingsGoals(){
  if(S.savingsGoal !== undefined){
    var goals = (S.savingsGoals && S.savingsGoals.length) ? S.savingsGoals.slice() : [];
    var old = S.savingsGoal;
    var hasUntagged = (S.savingsEntries||[]).some(function(e){ return !e.goalId; });
    if(goals.length===0 && old && old.name){
      goals.push({ id:"g"+Date.now(), name:old.name, target:num(old.target) });
    } else if(goals.length===0 && hasUntagged){
      goals.push({ id:"g"+Date.now(), name:"Savings", target:0 });
    }
    if(goals.length){
      var gid = goals[0].id;
      S.savingsEntries = (S.savingsEntries||[]).map(function(e){
        if(!e.goalId) e.goalId = gid;
        return e;
      });
    }
    S.savingsGoals = goals;
    delete S.savingsGoal;
  }
  if(!S.savingsGoals) S.savingsGoals = [];
  if(S.savingsGoals.length > 5) S.savingsGoals = S.savingsGoals.slice(0,5);
}
function savingsTotalFor(goalId){
  return S.savingsEntries.reduce(function(s,e){
    if(e.goalId !== goalId) return s;
    return s + (e.type==="withdrawal" ? -num(e.amount) : num(e.amount));
  },0);
}
function ensureActiveSavingsGoal(){
  if(!S.savingsGoals.length){ activeSavingsGoalId = null; return null; }
  var found = S.savingsGoals.filter(function(g){ return g.id===activeSavingsGoalId; })[0];
  if(!found){ activeSavingsGoalId = S.savingsGoals[0].id; found = S.savingsGoals[0]; }
  return found;
}
/* --- goal-linked bills: marking one paid logs a matching deposit; unpaying or deleting
   either side keeps the other in sync. All-or-nothing only — no partial deposits. --- */
function goalDepositEntry(billId, y, m, occ){
  return S.savingsEntries.filter(function(e){
    return e.billLink && e.billLink.billId===billId && e.billLink.y===y && e.billLink.m===m && e.billLink.occ===(occ||1);
  })[0];
}
function createGoalDeposit(b, y, m, occ, amount){
  if(!b.linkedGoalId) return;
  if(!S.savingsGoals.some(function(g){ return g.id===b.linkedGoalId; })) return; // linked goal was deleted — behave like a normal bill
  var amt = amount===undefined ? fullAmountFor(b, monthDataAt(y,m), occ) : num(amount);
  var existing = goalDepositEntry(b.id, y, m, occ);
  if(existing){ existing.amount = amt; return; } // already logged — update to the corrected amount instead of duplicating
  S.savingsEntries.push({
    id: "s"+Date.now(),
    date: new Date().toISOString().slice(0,10),
    note: "",
    type: "deposit",
    amount: amt,
    goalId: b.linkedGoalId,
    billLink: { billId:b.id, y:y, m:m, occ:occ||1 }
  });
  activeSavingsGoalId = b.linkedGoalId;
}
function deleteGoalDeposit(billId, y, m, occ){
  S.savingsEntries = S.savingsEntries.filter(function(e){
    return !(e.billLink && e.billLink.billId===billId && e.billLink.y===y && e.billLink.m===m && e.billLink.occ===(occ||1));
  });
}
function savingsTotal(){
  return S.savingsEntries.reduce(function(s,e){ return s + (e.type==="withdrawal" ? -num(e.amount) : num(e.amount)); },0);

function savingsVisibleEntries(){
  var list = S.savingsEntries.slice();
  if(savingsFilterScope==="month"){
    list = list.filter(function(e){ var d=new Date(e.date+"T00:00:00"); return !isNaN(d) && d.getFullYear()===view.y && (d.getMonth()+1)===view.m; });
  } else if(savingsFilterScope==="year"){
    list = list.filter(function(e){ var d=new Date(e.date+"T00:00:00"); return !isNaN(d) && d.getFullYear()===view.y; });
  }
  if(savingsFilterType){
    list = list.filter(function(e){ return e.type===savingsFilterType; });
  }
  if(savingsFilterGoal){
    list = list.filter(function(e){ return e.goalId===savingsFilterGoal; });
  }
  var q = savingsSearchQuery.trim().toLowerCase();
  if(q){
    list = list.filter(function(e){ return (e.note||"").toLowerCase().indexOf(q)>=0; });
  }
  return list;
}
function savingsSortEntries(list){
  var sorted = list.slice();
  if(savingsSort==="date_asc") sorted.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  else if(savingsSort==="amount_desc") sorted.sort(function(a,b){ return num(b.amount)-num(a.amount); });
  else sorted.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); }); // covers date_desc AND within-group order for goal_group
  return sorted;
}

  var prior = sEditId ? S.savingsEntries.filter(function(x){return x.id===sEditId;})[0] : null;

  // A goal can't go below $0 — back the entry's own prior contribution out first so editing
  // an existing entry checks the real delta, not double-counting it against itself.
  var currentTotal = savingsTotalFor(goalId);
  if(prior && prior.goalId===goalId){
    currentTotal -= (prior.type==="withdrawal" ? -num(prior.amount) : num(prior.amount));
  }
  var newTotal = currentTotal + (type==="withdrawal" ? -amount : amount);
  if(newTotal < -0.005){
    var goal = S.savingsGoals.filter(function(g){ return g.id===goalId; })[0];
    var maxOut = Math.max(0, currentTotal);
    err.textContent = "That would take "+(goal?goal.name:"this goal")+" below $0 — the most you can withdraw right now is "+usd(maxOut)+".";
    err.style.display="block";
    return;
  }

  var entry = { id: sEditId || ("s"+Date.now()), amount:Math.abs(amount), date:date, note:note, type:type, goalId:goalId,
    billLink: prior ? prior.billLink : undefined };
  var found = false;
  S.savingsEntries = S.savingsEntries.map(function(x){ if(x.id===entry.id){ found=true; return entry; } return x; });
  if(!found) S.savingsEntries.push(entry);
  activeSavingsGoalId = goalId;
  persist(); closeModal(); render();
}

/* --- CSV helpers (shared by Journal and Savings exports) --- */
function csvEscape(s){
  s = String(s==null?"":s);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function toCsv(headers, rows){
  var lines = [headers.map(csvEscape).join(",")];
  rows.forEach(function(r){ lines.push(r.map(csvEscape).join(",")); });
  return lines.join("\r\n");
}
function saveCsv(filename, csvText){
  if(nativeFileReady()){
    var P = window.Capacitor.Plugins;
    P.Filesystem.writeFile({ path: filename, data: csvText, directory: "CACHE", encoding: "utf8" })
      .then(function(){ return P.Filesystem.getUri({ directory: "CACHE", path: filename }); })
      .then(function(res){ return P.Share.share({ title: filename, text: "Billfold export", url: res.uri, dialogTitle: "Save your export" }); })
      .catch(function(e){
        if(e && (""+e).toLowerCase().indexOf("cancel") >= 0) return;
        csvBlobFallback(filename, csvText);
      });
    return;
  }
  csvBlobFallback(filename, csvText);
}
function csvBlobFallback(filename, csvText){
  try{
    var blob = new Blob([csvText], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ /* best effort */ }
}

// The next upcoming reminder fire time for a single bill — mirrors rescheduleReminders()'s
// per-bill logic (same 3-month lookahead, same skip rules) so what's shown here always
// matches what will actually be scheduled.
function nextReminderFireAt(b){
  var now = new Date();
  var startY = now.getFullYear(), startM = now.getMonth()+1;
  var occurrences = b.freq==="semimonthly" ? [b.dueDay,b.dueDay2] : [b.dueDay];
  var earliest = null;
  for(var i=0;i<3;i++){
    var m = startM + i, y = startY;
    while(m>12){ m-=12; y++; }
    if(!dueInMonth(b,m)) continue;
    occurrences.forEach(function(day, idx){
      if(!day) return;
      var occ = idx+1;
      if(isSkipped(b,y,m,occ)) return;
      if(billLeftAt(y,m,b.id,occ) === 0) return; // already paid, skip
      var actualDay = Math.min(day, new Date(y,m,0).getDate());
      var due = new Date(y, m-1, actualDay, 9, 0, 0);
      var fireAt = new Date(due.getTime() - (num(S.remindDays)*24*60*60*1000));
      if(fireAt.getTime() <= now.getTime()) return; // don't count a fire time already in the past
      if(!earliest || fireAt.getTime() < earliest.getTime()) earliest = fireAt;
    });
  }
  return earliest;
}

function installDetailCard(){

  }
  var ua = navigator.userAgent || "";

  if(deferredInstallPrompt){
    return '<p class="muted" style="font-size:.9rem;margin-bottom:1rem">Adds a Billfold icon to your home screen that opens full-screen, like a regular app — no browser bar, no app store.</p>'
      + '<button class="btn btn-pine" style="width:100%" onclick="triggerInstallPrompt()">'+icon("down",16)+' Install Billfold</button>';
  }
  if(isIOS){
    return '<p class="muted" style="font-size:.9rem;margin-bottom:1rem">iPhones and iPads don\'t let a website trigger this directly — Apple only allows it from Safari\'s own Share menu. A few taps:</p>'
      + '<ol style="font-size:.9rem;line-height:2;padding-left:1.1rem">'
      + '<li>Tap the <b>Share</b> icon in Safari\'s toolbar (a square with an arrow pointing up)</li>'

      + '</ol>'
      + '<p class="muted" style="font-size:.75rem;margin-top:.75rem">Must be opened directly in Safari — this doesn\'t work from inside another app\'s built-in browser (Gmail, Instagram, etc.).</p>';
  }
  return '<p class="muted" style="font-size:.9rem">This browser hasn\'t offered an install prompt yet — sometimes it takes a moment after loading, or it may not support it. Look for \u201cInstall app\u201d or \u201cAdd to Home screen\u201d in its menu as a fallback.</p>';

function dtSave(){
  var name = document.getElementById("dtName").value.trim();
  var balance = num(document.getElementById("dtBalance").value);
  var activeEl = document.getElementById("dtActive");
  var active = !!(activeEl && activeEl.getAttribute("data-on")==="1");
  var usableEl = document.getElementById("dtUsable");
  var usableAsPayment = !!(usableEl && usableEl.value==="1");
  var pmEl = document.getElementById("dtPayoffMethod");
  var payoffMethod = usableAsPayment ? ((pmEl && pmEl.value) || "full") : "fixed";
  var mpInput = document.getElementById("dtMonthlyPayment");
  var monthlyPayment = mpInput ? num(mpInput.value) : 0;
  var err = document.getElementById("dtErr");
  function fail(m){ err.textContent=m; err.style.display="block"; }
  if(!name) return fail("Give the debt a name.");
  if(balance<0) return fail("Balance can't be negative.");
  if(payoffMethod==="fixed" && monthlyPayment<=0) return fail("Set a monthly payment amount greater than $0.");
  var prior = debtEditId ? S.debts.filter(function(x){return x.id===debtEditId;})[0] : null;
  var debt = { id: debtEditId || ("debt"+Date.now()), name:name, balance:balance, active:active, usableAsPayment:usableAsPayment,
    payoffMethod: payoffMethod, monthlyPayment: monthlyPayment,
    everCarriedBalance: (prior && prior.everCarriedBalance) || balance>0,
    paidMonths: prior ? (prior.paidMonths||{}) : {}, payMethodByMonth: prior ? (prior.payMethodByMonth||{}) : {},
    defaultPayMethod: prior ? prior.defaultPayMethod : undefined };
  var found = false;
  S.debts = S.debts.map(function(x){ if(x.id===debt.id){ found=true; return debt; } return x; });
  if(!found) S.debts.push(debt);
  persist(); closeModal(); render();
}

function helpDetailCard(){
  var q = helpSearchQuery.trim().toLowerCase();
  var matchedHelp = HELP_ITEMS.filter(function(item){
    if(!q) return true;
    return item.title.toLowerCase().indexOf(q)>=0 || item.body.toLowerCase().indexOf(q)>=0;
  });
  var matchedGlossary = GLOSSARY_ITEMS.filter(function(g){
    if(!q) return true;
    return g.term.toLowerCase().indexOf(q)>=0 || g.def.toLowerCase().indexOf(q)>=0;
  });

  var searchBar = '<div class="field" style="display:flex;align-items:center;gap:.4rem;margin-bottom:1rem;padding:0 .4rem 0 .6rem">'
    + '<span style="color:var(--sub);display:flex;flex:none">'+icon("search",14)+'</span>'
    + '<input id="helpSearchInput" style="flex:1;min-width:0;border:none;background:none;padding:.55rem 0;font-weight:500;font-size:.85rem" '
    + 'placeholder="Search help…" value="'+esc(helpSearchQuery)+'" oninput="setHelpSearch(this)">'
    + (helpSearchQuery ? '<button aria-label="Clear search" style="color:var(--sub);padding:.2rem" onclick="clearHelpSearch()">'+icon("x",14)+'</button>' : '')
    + '</div>';

  if(q && !matchedHelp.length && !matchedGlossary.length){
    return searchBar + '<p class="muted" style="font-size:.875rem;padding:0 .25rem">No results for “'+esc(helpSearchQuery.trim())+'.”</p>';
  }

  var helpHtml = matchedHelp.map(function(item){ return helpItem(item.title, item.body, item.id, !!q); }).join("");
  var glossaryHtml = '';
  if(matchedGlossary.length){
    glossaryHtml = '<div class="divider" style="margin:1rem 0"></div>'
      + '<h3 style="font-size:.85rem;font-weight:700;margin-bottom:.25rem">Glossary</h3>'

  return searchBar + helpHtml + glossaryHtml;
}

/* ================= MODALS ================= */
function modal(title, inner){
  document.getElementById("modalRoot").innerHTML =
    '<div class="overlay" onclick="if(event.target===this)closeModal()">'
    + '<div class="sheet"><div class="sheet-head"><h2>'+title+'</h2>'
    + '<button aria-label="Close" style="color:var(--sub);padding:.3rem" onclick="closeModal()">'+icon("x",20)+'</button></div>'
    + inner + '</div></div>';
  focusFirstField();
}
/* Auto-focus the first real field so a mouse/keyboard user can start typing or tabbing right
   away. Scoped to pointer-fine devices (mouse/trackpad) — on a touch device this would pop
   the on-screen keyboard the instant a modal opens, which is more disruptive than helpful. */
function focusFirstField(){
  try{
    if(!(window.matchMedia && window.matchMedia("(pointer: fine)").matches)) return;
    var sheet = document.querySelector(".sheet");
    if(!sheet) return;
    var field = sheet.querySelector('input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), select:not([disabled])');
    if(field){ field.focus(); if(field.select && field.tagName!=="SELECT") field.select(); }
  }catch(e){ /* best effort — never let this break modal opening */ }
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
  payId=null; editId=null; confirmDel=false;
  jEditId=null; jConfirmDel=false; sEditId=null; sConfirmDel=false;
  fundEditId=null; fundConfirmDel=false;
  devForgotArmed=false;
}

/* --- pay --- */
function openPay(id, occ){
  payId = id; payOcc = occ || 1;
  var b = billsList().filter(function(x){return x.id===id;})[0];
  if(!b) return;
  var y = view.y, m = view.m;
  var skipped = isSkipped(b, y, m, payOcc);
  var data = touchMonth();
  var full = fullAmountFor(b, data, payOcc);
  var l = leftOf(b, data, payOcc);
  var isPaid = !skipped && l===0;
  var billOccs = billOccurrencesInMonth(b, y, m);
  var occIdx = billOccs.indexOf(payOcc);
  var occNote = billOccs.length>1 && occIdx>=0 ? " · payment "+(occIdx+1)+" of "+billOccs.length : "";
  var topBlock = '<p class="muted" style="font-size:.875rem;margin-bottom:1rem">'+usd(full)+' · '+freqText(b)+occNote+'</p>';

  // Payment-method choice: only once there's a credit option to actually choose between —
  // otherwise it'd just be a dropdown of one. Falls back to the bill's own default method when
  // there's no payment recorded yet this month. Changing it here only applies to this one
  // payment — the bill's actual default only changes from Edit bill, not from here.
  var methodKey = leftKey(b.id, payOcc);
  var opts = paymentOptions();
  var currentMethod = (data.payMethod && data.payMethod[methodKey]) || b.defaultPayMethod || "available";
  var methodBlock = opts.length>1
    ? '<div class="fgroup" style="margin-top:.9rem"><label class="flabel">Pay with</label>'
      + '<select id="payMethodSel" class="field">'
      + opts.map(function(o){ return '<option value="'+esc(o.id)+'"'+(o.id===currentMethod?" selected":"")+'>'+esc(o.name)+'</option>'; }).join("")
      + '</select></div>'
    : '';

  var goal = b.linkedGoalId ? S.savingsGoals.filter(function(g){ return g.id===b.linkedGoalId; })[0] : null;
  var goalNote = !b.linkedGoalId ? ""
    : goal ? (isPaid
        ? 'Logged a matching deposit to <b style="color:var(--ink)">'+esc(goal.name)+'</b> — unpaying removes it.'
        : 'Confirming this also logs a matching deposit to <b style="color:var(--ink)">'+esc(goal.name)+'</b>.')
      : (isPaid ? '' : 'The savings goal this was linked to no longer exists, so this behaves like a normal bill — no deposit will be logged.');
  modal(esc(b.name),
    topBlock
    + (skipped ? '<p style="font-size:.85rem;font-weight:600;margin-bottom:1rem">Skipped this month — nothing due.</p>' : '')
    + '<label class="flabel">Amount</label>'
    + (isPaid
        ? ('<div class="field" style="display:flex;align-items:center;font-weight:600" aria-label="Amount, view only">'+usd(full)+'</div>'
          + '<p class="muted" style="font-size:.75rem;margin-top:.5rem">Marked paid. Mark it unpaid to change the amount or how it was paid.'
            + (goalNote ? " "+goalNote : "") + '</p>'
          + '<div class="grid2" style="margin-top:.75rem">'
          + '<button id="varUnpayBtn" class="btn btn-ghost" onclick="varPayClear()">Mark unpaid</button>'
          + '<button class="btn btn-ghost" onclick="closeModal();openExpenseForm(\''+b.id+'\')">Edit bill</button></div>')
        : ('<div style="display:flex;gap:.5rem">'
          + '<div class="money" style="flex:1;width:auto;border-radius:.75rem;padding:0 .75rem">'
          + '<span>$</span><input id="payInput" class="tnum" inputmode="decimal" value="'+full+'" '+(skipped?"disabled":"")+' '
          + 'style="padding:.6rem 0 .6rem .25rem;font-size:1rem" onkeydown="if(event.key===\'Enter\')varPaySave()">'+calcBtn()+'</div>'
          + '<button class="btn btn-ink" onclick="varPaySave()"'+(skipped?' disabled':'')+'>Mark paid</button></div>'
          + methodBlock
          + '<p class="muted" style="font-size:.75rem;margin-top:.5rem">Defaults to '+usd(b.estimate)+'. Enter the real amount if it\'s different, then confirm — that\u2019s what moves Available now.'
            + (goalNote ? " "+goalNote : "") + '</p>'
          + '<div class="divider" style="margin:1rem 0"></div>'
          + '<div class="grid2">'
          + '<button class="btn btn-ghost" onclick="billSkipToggle()">'+(skipped?"Clear skip — due again":"Skip this payment")+'</button>'
          + '<button class="btn btn-ghost" onclick="closeModal();openExpenseForm(\''+b.id+'\')">Edit bill</button></div>')));
  var vinp = document.getElementById("payInput");
  if(vinp && !skipped){ vinp.focus(); vinp.select(); }
}
function getPayMethod(){
  var sel = document.getElementById("payMethodSel");
  return sel ? sel.value : undefined; // undefined = let the payment function keep whatever was used before
}
function varPaySave(){
  var inp = document.getElementById("payInput");
  if(payId!==null && inp){
    var b = billsList().filter(function(x){return x.id===payId;})[0];
    var amt = num(inp.value);
    markVariablePaid(payId, amt, payOcc, getPayMethod());
    if(b && b.linkedGoalId) createGoalDeposit(b, view.y, view.m, payOcc, amt);
  }
  closeModal(); showBalanceWarning();
}
function varPayClear(){
  if(payId!==null){
    var b = billsList().filter(function(x){return x.id===payId;})[0];
    if(b && b.linkedGoalId){
      var entry = goalDepositEntry(payId, view.y, view.m, payOcc);
      if(entry) deleteGoalDeposit(payId, view.y, view.m, payOcc);
    }
    unmarkVariablePaid(payId, payOcc);
  }
  closeModal(); showBalanceWarning();
}
/* Shared by every pay modal, so there's exactly one place that knows how to skip a bill —
   cleaning up any goal deposit if it's linked, and always routing the actual "left"/varPaid
   clear through the normal unpay path so any auto-reduce-balance adjustment gets reversed
   correctly rather than silently left in place. */
function billSkipToggle(){
  var b = billsList().filter(function(x){return x.id===payId;})[0];
  if(!b) return;
  var y = view.y, m = view.m, occ = payOcc;
  var data = touchMonth();
  var key = leftKey(b.id, occ);
  if(data.skipped[key]){
    delete data.skipped[key];
    persist(); closeModal(); render();
    if(S.remindersOn) scheduleRemindersDebounced();
  } else {
    if(b.linkedGoalId){
      var entry = goalDepositEntry(b.id, y, m, occ);
      if(entry) deleteGoalDeposit(b.id, y, m, occ);
    }
    data.skipped[key] = true;
    // Clear this occurrence's paid state, reversing any auto-reduce-balance adjustment — just
    // this one payment, not every occurrence the bill has this month.
    unmarkVariablePaid(b.id, occ);
    closeModal();
    showBalanceWarning();
  }
}

function expSave(){
  var type = document.getElementById("expType").value;
  var name = document.getElementById("expName").value.trim();
  var amount = num(document.getElementById("expAmount").value);
  var active = document.getElementById("expActive").getAttribute("data-on")==="1";
  var err = document.getElementById("expErr");
  function fail(m){ err.textContent=m; err.style.display="block"; }
  if(!name) return fail("Give it a name.");
  if(!amount) return fail("Enter an amount above zero.");

  var prior = editId ? S.expenses.filter(function(x){return x.id===editId;})[0] : null;

  if(type==="fund"){
    var fCatSel = document.getElementById("expFundCat").value;
    var fCat = fCatSel==="__new" ? document.getElementById("expFundNewCat").value.trim() : fCatSel;
    if(!fCat) return fail("Pick or type a category.");
    var cashEl = document.getElementById("expCashFund");
    var isCash = !!(cashEl && cashEl.getAttribute("data-on")==="1");
    var fexp = { id: editId || ("e"+Date.now()), type:"fund", name:name, budget:amount, category:fCat, active:active, cashFund:isCash };
    var ffound = false;
    S.expenses = S.expenses.map(function(x){ if(x.id===fexp.id){ffound=true; return fexp;} return x; });
    if(!ffound) S.expenses.push(fexp);
    if(S.categories.indexOf(fCat)<0) S.categories.push(fCat);
    persist(); closeModal(); render();
    return;
  }

  var freq = document.getElementById("expFreq").value;
  var catSel = document.getElementById("expCat").value;
  var goalSel = document.getElementById("expGoalLink");
  var linkedGoalId = (goalSel && goalSel.value) ? goalSel.value : undefined;
  if(linkedGoalId) type = "variable";
  var cat = catSel==="__new" ? document.getElementById("expNewCat").value.trim() : catSel;
  var month = parseInt(document.getElementById("expMonth").value,10) || 1;
  var dueDayRaw = freq==="payday" ? NaN : parseInt(document.getElementById("expDueDay").value,10);
  var dueDay = (dueDayRaw>=1 && dueDayRaw<=31) ? dueDayRaw : null;
  var dueDay2Raw = freq==="semimonthly" ? parseInt(document.getElementById("expDueDay2").value,10) : NaN;
  var dueDay2 = (dueDay2Raw>=1 && dueDay2Raw<=31) ? dueDay2Raw : null;
  var remindEl = document.getElementById("expRemind");

// Small stable hash so each (bill, year, month) pair always maps to the same notification id.
function hashId(str){
  var h = 0;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h) % 2000000000;
}
var remindTimer = null;
function scheduleRemindersDebounced(){
  if(remindTimer) clearTimeout(remindTimer);
  remindTimer = setTimeout(rescheduleReminders, 600);

function rescheduleReminders(){
  if(!nativeNotifReady()) return;
  var LN = window.Capacitor.Plugins.LocalNotifications;
  LN.getPending().then(function(res){
    var ids = (res.notifications||[]).map(function(n){ return { id:n.id }; });
    return ids.length ? LN.cancel({ notifications: ids }) : Promise.resolve();
  }).then(function(){
    if(!S.remindersOn) return;
    var toSchedule = [];
    var now = new Date();
    var startY = now.getFullYear(), startM = now.getMonth()+1;
    for(var i=0;i<3;i++){
      var m = startM + i, y = startY;
      while(m>12){ m-=12; y++; }
      var data = monthDataAt(y,m);
      billsList().forEach(function(b){
        if(!b.active) return;
        if(b.remindOff) return; // muted individually in Settings → Reminders
        if(!dueInMonth(b,m)) return;
        var occurrences = b.freq==="semimonthly" ? [[1,b.dueDay],[2,b.dueDay2]] : [[1,b.dueDay]];
        occurrences.forEach(function(pair){
          var occ = pair[0], day = pair[1];
          if(!day) return;
          if(isSkipped(b,y,m,occ)) return;
          if(billLeftAt(y,m,b.id,occ) === 0) return; // already paid, skip
          var actualDay = Math.min(day, new Date(y,m,0).getDate());
          var due = new Date(y, m-1, actualDay, 9, 0, 0);
          var fireAt = new Date(due.getTime() - (num(S.remindDays)*24*60*60*1000));
          if(fireAt.getTime() <= now.getTime()) return; // don't schedule for the past
          toSchedule.push({
            id: hashId(b.id+"-"+y+"-"+m+"-"+occ),
            title: b.name + " due soon",
            body: usd(fullAmountFor(b,data,occ)) + " due " + MS[m-1] + " " + actualDay,
            schedule: { at: fireAt },
            actionTypeId: "BILL_REMINDER",
            extra: { billId: b.id, y:y, m:m, occ:occ }
          });
        });
      });
    }
    if(toSchedule.length) return LN.schedule({ notifications: toSchedule });
  }).catch(function(){ /* best effort; a failed schedule pass isn't worth surfacing */ });
}
function setRemindersOn(on){

    if(res && res.display === "granted") return { display:"granted" };
    return LN.requestPermissions();

/* ---------- hardware / gesture back button (native only) ---------- *
 * Capacitor routes both the physical back button AND Android's edge-swipe
 * back gesture through the same @capacitor/app "backButton" event. Once you
 * listen for it, you own the behavior entirely — the platform's own default
 * (web-history-back, else exit) no longer runs. So this handler has to
 * explicitly replicate "close whatever's on top" for every layer the app
 * can have open, and fall back to exiting only when nothing is open:
 *   1. A modal/sheet (any form, the ⋯ menus, the month picker) — close it.

var BACKUP_NAME_KEY = "billfold:lastBackupName";
/* ---------- backup reminder (nudges toward Settings → Backup, doesn't back up on its own) ----------
   Tracked outside S on purpose: these are device-local reminder bookkeeping, not budget data,
   so they shouldn't get swept into export/restore or synced across devices via a backup file. */
var BACKUP_LAST_AT_KEY = "billfold:lastBackupAt";
var BACKUP_COUNT_KEY = "billfold:lastBackupRecordsCount";
var BACKUP_SNOOZE_KEY = "billfold:backupSnoozeUntil";
var BACKUP_RECORDS_THRESHOLD = 25; // meaningful entries added/changed since last backup, regardless of days
function recordsCount(){
  return (S.journal?S.journal.length:0) + (S.savingsEntries?S.savingsEntries.length:0)
    + (S.expenses?S.expenses.length:0) + (S.savingsGoals?S.savingsGoals.length:0);
}
function markBackedUp(){
  try{
    localStorage.setItem(BACKUP_LAST_AT_KEY, String(Date.now()));
    localStorage.setItem(BACKUP_COUNT_KEY, String(recordsCount()));
    localStorage.removeItem(BACKUP_SNOOZE_KEY);
  }catch(e){}
}
function snoozeBackupReminder(days){

}
// Checked once per app launch (see bootApp). Returns true if it showed the modal, so the
// caller can avoid stacking it on top of the first-launch welcome modal.
function maybeShowBackupReminder(){
  if(S.backupRemindersOn===false) return false;
  var last = null;
  try{ var v = localStorage.getItem(BACKUP_LAST_AT_KEY); last = v?parseInt(v,10):null; }catch(e){}
  if(last===null){
    // First time this device has ever checked — set a baseline instead of nagging someone
    // who just installed the app and hasn't entered anything yet.
    try{ localStorage.setItem(BACKUP_LAST_AT_KEY, String(Date.now())); localStorage.setItem(BACKUP_COUNT_KEY, String(recordsCount())); }catch(e){}
    return false;
  }
  try{
    var snooze = localStorage.getItem(BACKUP_SNOOZE_KEY);
    if(snooze && Date.now() < parseInt(snooze,10)) return false;
  }catch(e){}
  if(recordsCount()===0) return false; // nothing worth backing up yet
  var days = Math.max(1, num(S.backupReminderDays) || 14);
  var daysSince = (Date.now()-last)/(24*60*60*1000);
  var lastCount = 0;
  try{ var c = localStorage.getItem(BACKUP_COUNT_KEY); lastCount = c?parseInt(c,10):0; }catch(e){}
  var changedSince = recordsCount() - lastCount;
  if(daysSince < days && changedSince < BACKUP_RECORDS_THRESHOLD) return false;
  var why = daysSince>=days
    ? "It's been " + Math.floor(daysSince) + " day" + (Math.floor(daysSince)===1?"":"s") + " since your last backup."
    : "You've added a good amount of new data since your last backup.";
  modal("Back up your data?",
    '<p class="muted" style="font-size:.875rem;margin-bottom:1rem">'+why+' A backup file protects your bills, spending, and savings history if this device is lost, reset, or the app is uninstalled.</p>'
    + '<button class="btn btn-pine" style="width:100%;margin-bottom:.5rem" onclick="closeModal();openExport()">Back up now</button>'
    + '<button class="btn btn-ghost" style="width:100%" onclick="dismissBackupReminder()">Remind me later</button>');
  return true;
}

function exDownload(){

/* ================================================================
   APP LOCK — a local PIN gate. Everything here is device-only:
   the PIN (as a salted hash, never the PIN itself) lives in its own
   localStorage key, separate from your budget data, so it's never
   included in a backup file and never leaves this device.
   ================================================================ */
var LOCK_KEY = "billfold:lock";
var lockState = loadLockState();
var lockUnlocked = false;

function loadLockState(){
  try{
    var raw = localStorage.getItem(LOCK_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.hash) return d; }
  }catch(e){ /* ignore */ }
  return { hash:null, salt:null, len:null };
}
function persistLockState(){
  try{ localStorage.setItem(LOCK_KEY, JSON.stringify(lockState)); }catch(e){ /* best effort */ }
}
function lockIsSet(){ return !!(lockState && lockState.hash); }
function randomSalt(){
  var bytes = new Uint8Array(16);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
  else for(var i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
  var s = "";
  for(var j=0;j<bytes.length;j++) s += bytes[j].toString(16).padStart(2,"0");
  return s;
}
// Subtle-crypto SHA-256 when available (native app / any secure context).
function sha256Hex(text){
  if(window.crypto && window.crypto.subtle && window.isSecureContext){
    var enc = new TextEncoder().encode(text);
    return window.crypto.subtle.digest("SHA-256", enc).then(function(buf){
      var arr = Array.from(new Uint8Array(buf));
      return arr.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }
  // Fallback for non-secure contexts (e.g. a plain file:// preview) where
  // SubtleCrypto is unavailable. Not cryptographic, but this is a local
  // deterrent lock, not a security boundary against a determined attacker
  // with access to the device's storage.
  var h1 = 0, h2 = 0;
  for(var i=0;i<text.length;i++){
    var c = text.charCodeAt(i);
    h1 = (Math.imul(h1, 31) + c) | 0;
    h2 = (Math.imul(h2, 131) + c) | 0;
  }
  return Promise.resolve(((h1>>>0).toString(16)) + ((h2>>>0).toString(16)));
}
function hashPin(pin, salt){
  return sha256Hex(salt + ":" + pin);
}
function setPin(pin){
  var salt = randomSalt();
  return hashPin(pin, salt).then(function(hash){
    lockState = { hash:hash, salt:salt, len:pin.length };
    persistLockState();
  });
}

  return hashPin(pin, lockState.salt).then(function(hash){ return hash === lockState.hash; });
}
function clearPin(){
  lockState = { hash:null, salt:null, len:null };
  persistLockState();
}
function wipeDeviceForReset(){
  try{ localStorage.removeItem(KEY); }catch(e){ /* ignore */ }
  try{ localStorage.removeItem(LOCK_KEY); }catch(e){ /* ignore */ }
  window.location.reload();
}

/* --- Developer options: a second, separate PIN gate, dev-only, never in backups ---
   Default PIN is 192837 — change it from inside Developer options once you're in.
   Stored on-device only, seeded on first boot, independent of the app-lock PIN above. */
var DEV_KEY = "billfold:dev";
var DEV_DEFAULT_PIN = "192837";
var devState = loadDevState();
var devUnlocked = false;
if(!devState){
  var _devSeedSalt = randomSalt();
  hashPin(DEV_DEFAULT_PIN, _devSeedSalt).then(function(h){
    devState = { hash:h, salt:_devSeedSalt };
    persistDevState();
  });
}
function loadDevState(){
  try{
    var raw = localStorage.getItem(DEV_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.hash) return d; }
  }catch(e){ /* ignore */ }
  return null;
}
function persistDevState(){
  try{ localStorage.setItem(DEV_KEY, JSON.stringify(devState)); }catch(e){ /* best effort */ }
}
function checkDevPin(pin){
  if(!devState) return Promise.resolve(false); // still seeding — try again in a moment
  return hashPin(pin, devState.salt).then(function(hash){ return hash === devState.hash; });
}
function setDevPin(pin){
  var salt = randomSalt();
  return hashPin(pin, salt).then(function(hash){
    devState = { hash:hash, salt:salt };
    persistDevState();
  });
}
var devForgotArmed = false;
/* Developer options is no longer a visible Settings row — tapping "Last saved" 7 times within
   a couple seconds opens the same PIN prompt as before. This is on top of the PIN, not instead
   of it; it just keeps the entry point from being an obvious, permanently-listed row. */
var devTapCount = 0, devTapTimer = null;
function devSecretTap(){
  devTapCount++;
  if(devTapTimer) clearTimeout(devTapTimer);
  devTapTimer = setTimeout(function(){ devTapCount = 0; }, 2000);
  if(devTapCount >= 5){
    devTapCount = 0;
    openDevPinPrompt();

function openDevPinPrompt(){
  modal("Developer options",

    + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();devPinCheck();}">'
    + '<p id="devPinErr" class="msg-err" style="display:none;margin-top:.5rem"></p>'

    + '<button id="devForgotBtn" class="btn btn-ghost" style="width:100%;margin-top:.5rem" onclick="devForgotPin()">Forgot PIN? Reset to default</button>'
    + '<p class="muted" style="font-size:.72rem;margin-top:.6rem">This only resets access to Developer options — it doesn\'t touch your bills, funds, or any other data.</p>');
  setTimeout(function(){ var el = document.getElementById("devPinInput"); if(el) el.focus(); }, 50);

function devForgotPin(){
  if(!devForgotArmed){
    devForgotArmed = true;
    var btn = document.getElementById("devForgotBtn");
    if(btn) btn.textContent = "Tap again to reset to " + DEV_DEFAULT_PIN;
    setTimeout(function(){ devForgotArmed = false; var b = document.getElementById("devForgotBtn"); if(b) b.textContent = "Forgot PIN? Reset to default"; }, 4000);
    return;
  }
  devForgotArmed = false;
  var salt = randomSalt();
  hashPin(DEV_DEFAULT_PIN, salt).then(function(h){
    devState = { hash:h, salt:salt };
    persistDevState();
    var err = document.getElementById("devPinErr");
    if(err){ err.textContent = "Reset — the developer PIN is now " + DEV_DEFAULT_PIN + "."; err.style.display = "block"; err.className = "msg-ok"; }
    var btn = document.getElementById("devForgotBtn");
    if(btn) btn.textContent = "Forgot PIN? Reset to default";
    var input = document.getElementById("devPinInput");
    if(input) input.value = "";
  });
}
function devPinCheck(){
  var val = (document.getElementById("devPinInput")||{}).value || "";
  checkDevPin(val).then(function(ok){
    if(ok){
      devUnlocked = true;
      if(!S.devOptionsRevealed){ S.devOptionsRevealed = true; persist(); }
      closeModal();
      settingsSubScreen = "dev";
      window.scrollTo(0,0);
      render();
    } else {
      var err = document.getElementById("devPinErr");
      if(err){ err.textContent = "That PIN didn't work."; err.style.display = "block"; }
    }
  });
}

/* --- Web-only invite gate: keeps a shared preview link from being usable by
   anyone who stumbles on it. Has zero effect on the real installed app —
   it only ever runs when Billfold is opened as a plain website. --- */
function isWebOnly(){
  try{ return !(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()); }
  catch(e){ return true; }
}
var INVITE_KEY = "billfold:webInvite";
var INVITE_VERIFIED_KEY = "billfold:webInviteVerified";
// This is the code every new visitor's browser seeds against on their first-ever visit.
// There's no server, so this is the ONLY thing that actually controls who can get in —
// changing it means editing this line and redeploying, not the Developer options button below.
var INVITE_DEFAULT_CODE = "billfoldisawesome";
var inviteState = loadInviteState();
if(isWebOnly() && !inviteState){
  var _inviteSeedSalt = randomSalt();
  hashPin(INVITE_DEFAULT_CODE, _inviteSeedSalt).then(function(h){
    inviteState = { hash:h, salt:_inviteSeedSalt };
    persistInviteState();
  });
}
function loadInviteState(){
  try{
    var raw = localStorage.getItem(INVITE_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.hash) return d; }
  }catch(e){ /* ignore */ }
  return null;
}
function persistInviteState(){
  try{ localStorage.setItem(INVITE_KEY, JSON.stringify(inviteState)); }catch(e){ /* best effort */ }
}
function inviteVerified(){
  try{ return localStorage.getItem(INVITE_VERIFIED_KEY) === "1"; }catch(e){ return false; }
}
function markInviteVerified(){
  try{ localStorage.setItem(INVITE_VERIFIED_KEY, "1"); }catch(e){ /* best effort */ }
}
function checkInviteCode(code){
  if(!inviteState) return Promise.resolve(false); // still seeding — try again in a moment
  return hashPin(code, inviteState.salt).then(function(hash){ return hash === inviteState.hash; });
}
function setInviteCode(code){
  var salt = randomSalt();
  return hashPin(code, salt).then(function(hash){
    inviteState = { hash:hash, salt:salt };
    persistInviteState();
  });
}

function devSendTestNotification(){
  if(!nativeNotifReady()){ devMsg("Notifications need the installed app — not available in this preview.", false); return; }
  var LN = window.Capacitor.Plugins.LocalNotifications;
  LN.checkPermissions().then(function(res){
    if(res && res.display === "granted") return { display:"granted" };
    return LN.requestPermissions();
  }).then(function(res){
    if(!(res && res.display === "granted")){ devMsg("Notification permission isn't granted.", false); return; }
    return LN.schedule({ notifications: [{
      id: 999000001,
      title: "Billfold test notification",
      body: "If you can see this, scheduling and permissions are both working.",
      schedule: { at: new Date(Date.now() + 3000) }
    }] });
  }).then(function(){ devMsg("Sent — it should appear in about 3 seconds.", true); })
  .catch(function(e){ devMsg("Couldn't schedule it: " + ((e&&e.message)||e), false); });
}

/* ---------- Appearance (light / dark / system) ---------- */
var THEME_KEY = "billfold:theme";
function loadThemeSetting(){
  var v = localStorage.getItem(THEME_KEY);
  return (v==="light" || v==="dark" || v==="system") ? v : "system";
}
function effectiveTheme(setting){
  if(setting==="system"){
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  return setting;
}
function applyTheme(){
  var eff = effectiveTheme(loadThemeSetting());
  document.documentElement.setAttribute("data-theme", eff);
  var mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", eff==="dark" ? "#14181A" : "#F5F6F2");
}
function setAppearance(v){
  localStorage.setItem(THEME_KEY, v);
  applyTheme();
  render();
}
function appearanceCard(){
  var setting = loadThemeSetting();
  return '<p class="muted" style="font-size:.85rem;margin-bottom:.9rem">Choose how Billfold looks on this device.</p>'
    + '<div class="seg" style="width:100%">'
    + '<button style="flex:1" class="'+(setting==="light"?"on":"")+'" onclick="setAppearance(\'light\')">Light</button>'
    + '<button style="flex:1" class="'+(setting==="dark"?"on":"")+'" onclick="setAppearance(\'dark\')">Dark</button>'
    + '<button style="flex:1" class="'+(setting==="system"?"on":"")+'" onclick="setAppearance(\'system\')">System</button>'
    + '</div>'
    + '<p class="muted" style="font-size:.75rem;margin-top:.75rem">“System” follows your phone’s own light/dark setting, and switches automatically if that changes while Billfold is open.</p>';
}
function lockCard(){
  var set = lockIsSet();
  var body;
  if(!set){
    body = '<p class="muted" style="font-size:.85rem;margin-bottom:.75rem">Add a PIN to keep this open on your phone from being casually flipped through.</p>'
      + '<button class="btn btn-pine" style="width:100%" onclick="openSetPinForm(false)">Set a PIN</button>';
  } else {
    body = '<p class="muted" style="font-size:.85rem;margin-bottom:.75rem">A PIN is set on this device. You\'ll need it to open Billfold.</p>'
      + '<div class="grid2">'
      + '<button class="btn btn-ghost" onclick="openSetPinForm(true)">Change PIN</button>'
      + '<button class="btn btn-danger" onclick="turnOffPin()">Turn off lock</button>'
      + '</div>';
  }
  return body;
}
function openSetPinForm(isChange){
  modal(isChange ? "Change PIN" : "Set a PIN",
    '<div class="fgroup"><label class="flabel">New PIN (4–6 digits)</label>'
    + '<input id="spPin" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••"></div>'
    + '<div class="fgroup"><label class="flabel">Confirm PIN</label>'
    + '<input id="spPin2" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••"></div>'
    + '<p id="spErr" class="msg-err" style="display:none"></p>'
    + '<button class="btn btn-pine" style="width:100%;margin-top:1rem;padding:.8rem" onclick="spSave()">Save PIN</button>'
    + '<p class="muted" style="font-size:.72rem;margin-top:.6rem">If you forget this PIN, the only way back in is the “Forgot PIN?” reset on the lock screen — which erases everything on this device. Keep a backup (Settings → Back up) if you set a PIN.</p>');
}
function spSave(){
  var p1 = document.getElementById("spPin").value.trim();
  var p2 = document.getElementById("spPin2").value.trim();
  var err = document.getElementById("spErr");
  function fail(m){ err.textContent=m; err.style.display="block"; }
  if(!/^[0-9]{4,6}$/.test(p1)) return fail("Use 4 to 6 digits.");
  if(p1 !== p2) return fail("Those don't match — try again.");
  setPin(p1).then(function(){ closeModal(); render(); });
}
function turnOffPin(){
  clearPin(); render();
}

/* --- Full-screen lock gate shown at boot when a PIN is set --- */
var lockEntry = "";
function lockRender(){
  var root = document.getElementById("lockRoot");
  var dots = "";
  for(var i=0;i<6;i++) dots += '<span style="width:12px;height:12px;border-radius:999px;margin:0 5px;display:inline-block;background:'+(i<lockEntry.length?"var(--pine)":"var(--line)")+'"></span>';
  var keys = "";
  var rows = [["1","2","3"],["4","5","6"],["7","8","9"],["","0","del"]];
  rows.forEach(function(row){
    row.forEach(function(k){
      if(k===""){ keys += '<span></span>'; return; }
      if(k==="del"){
        keys += '<button class="calc-btn fn" onclick="lockBack()">⌫</button>';
      } else {
        keys += '<button class="calc-btn" onclick="lockDigit(\''+k+'\')">'+k+'</button>';
      }
    });
  });
  root.innerHTML =
    '<div style="position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;padding-top:calc(1.5rem + env(safe-area-inset-top));padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))">'
    + '<div style="color:var(--pine);margin-bottom:.5rem">'+icon("lock",32)+'</div>'
    + '<div class="wordmark" style="margin-bottom:1.5rem"><span class="dot"></span><span class="name">Billfold</span></div>'
    + '<div style="margin-bottom:1.25rem">'+dots+'</div>'
    + '<p id="lockErr" class="msg-err" style="display:none;text-align:center"></p>'
    + '<div class="keys" style="width:100%;max-width:280px;grid-template-columns:repeat(3,1fr)">'+keys+'</div>'
    + '<button class="btn btn-ghost" style="margin-top:1.5rem" onclick="openForgotPin()">Forgot PIN?</button>'
    + '</div>';
}
function lockDigit(d){
  var needLen = lockState.len || 6;
  if(lockEntry.length>=needLen) return;
  lockEntry += d;
  lockRender();
  if(lockEntry.length>=needLen){
    checkPin(lockEntry).then(function(ok){
      if(ok){
        lockUnlocked = true;
        lockEntry = "";
        document.getElementById("lockRoot").innerHTML = "";
        bootApp();
      } else {
        lockEntry = "";
        lockRender();
        var err = document.getElementById("lockErr");
        if(err){ err.textContent = "That PIN didn't work — try again."; err.style.display="block"; }
      }
    });
  }
}
function lockBack(){
  lockEntry = lockEntry.slice(0,-1);
  lockRender();
}
function openForgotPin(){
  modal("Forgot your PIN?",
    '<p style="font-size:.9rem;margin-bottom:.75rem">There\'s no way to recover a PIN — it\'s never stored anywhere, even by Billfold. The only option is to reset the app, which <b>permanently erases every bill, spending entry, and savings record on this device.</b></p>'
    + '<p class="muted" style="font-size:.85rem;margin-bottom:1rem">If you have a backup file, you can restore it after the reset from Settings → Restore.</p>'
    + '<button class="btn btn-danger" style="width:100%" onclick="confirmForgotReset()">Erase this device and remove the PIN</button>'
    + '<button class="btn btn-ghost" style="width:100%;margin-top:.5rem" onclick="closeForgotPin()">Cancel</button>');
}
function closeForgotPin(){
  document.getElementById("modalRoot").innerHTML = "";
}
function confirmForgotReset(){
  if(window.confirm("This erases all Billfold data on this device and cannot be undone. Continue?")){
    wipeDeviceForReset();
  }
}

/* ---------- boot ---------- */
function bootApp(){
  render();
  initAppShortcuts();
  initReminderActions();
  initHardwareBack();
  if(S.remindersOn) rescheduleReminders();
  if(!maybeShowIntro()) maybeShowBackupReminder();
}
applyTheme();
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    if(loadThemeSetting()==="system") applyTheme();
  });
}
document.addEventListener("keydown", calcKeydown);
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(openHelpItemId==="help-install") openHelpItem("help-install");
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  if(openHelpItemId==="help-install") openHelpItem("help-install");
});
if(isWebOnly() && !inviteVerified()){
  inviteGateRender();
} else if(lockIsSet()){
  lockRender();
} else {
  bootApp();
}
</script>
</body>
</html>
